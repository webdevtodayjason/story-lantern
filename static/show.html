  writing:  'writing this page',
  checking: 'making sure it is kind',
  voicing:  'finding the voice',
  painting: 'painting the picture'
};

function workshopReset(){
  body.classList.remove('planned');
  $('wsTitle').textContent = ''; $('wsTitle').classList.remove('on');
  $('wsLine').textContent = 'the lantern is dreaming up your story';
  $('wsDots').style.display = '';
  $('wsBoard').innerHTML = '';
}

/* The beats arrive all at once when the plan lands. They come in one after
   another anyway - eight plates appearing together is a jolt, eight appearing
   over a second and a half is a story being laid out on a table. */
function workshopPlan(story){
  var beats = story.spine || [];
  if (story.title){ $('wsTitle').textContent = story.title; $('wsTitle').classList.add('on'); }
  if (!beats.length) return;
  body.classList.add('planned');
  $('wsDots').style.display = 'none';
  // The plan exists; saying "dreaming" under a title and eight beats is the
  // kind of small lie that makes the whole screen feel fake. The first build
  // frame replaces this within a second.
  $('wsLine').textContent = 'laying out the pages';
  $('wsBoard').innerHTML = beats.map(function(b, i){
    return '<div class="pl" id="pl' + i + '" style="animation-delay:' + (i * 0.16).toFixed(2) + 's">' +
           '<div class="plate"></div><div class="beat">' + esc(b) + '</div></div>';
  }).join('');
}

function workshopStage(d){
  if (S.story && d.story_id != null && d.story_id !== S.story.story_id) return;
  var i = Number(d.idx) || 0, el = $('pl' + i);
  $('wsLine').innerHTML = 'page <i>' + (i + 1) + '</i> &middot; ' +
                          esc(STAGE[d.stage] || d.stage || '');
  if (!el) return;
  for (var k = 0; k < i; k++){ var prev = $('pl' + k); if (prev){ prev.classList.remove('now'); prev.classList.add('done'); } }
  el.classList.add('now');
}

/* ======================================================================
   The buttons, and the shelf
   Pause holds both halves of a page: the voice (on the audio element) and the
   clock that turns the page when there is no voice (inside pageLater). The
   shelf replays a story straight from the database - no device, no waiting.
   ====================================================================== */
function updateBar(){
  var reading = (S.phase === 'telling' || S.phase === 'ending');
  var live    = reading || S.phase === 'thinking';
  $('bPause').hidden = !reading || S.paused;
  $('bPlay').hidden  = !reading || !S.paused;
  $('bNew').hidden   = !live;
  $('bar').classList.add('show');
}

function setPaused(on){
  S.paused = !!on;
  body.classList.toggle('paused', S.paused);
  var pg = S.current;
  if (pg && pg._audio && !pg._audioFailed){
    try { if (S.paused) pg._audio.pause(); else pg._audio.play(); } catch(e){}
  }
  updateBar();
}

/* Straight back to the candle. finish()'s goodnight chain takes ten seconds,
   which is ten seconds of a child staring at a screen that is ignoring them. */
function newStory(){
  setPaused(false);
  if (!DEMO) jpost('/api/stop', {}, function(){});
  resetToIdle();
  if (!('ontouchstart' in window)) { try{ $('field').focus(); }catch(e){} }
}

function openShelf(){
  var list = $('shelfList'), empty = $('shelfEmpty');
  list.innerHTML = ''; empty.hidden = true;
  $('shelf').classList.add('show');
  jget('/api/stories', function(d){
    var all = ((d && d.stories) || []).filter(function(st){ return st.pages > 0; });
    if (!all.length){ empty.hidden = false; return; }
    list.innerHTML = all.map(function(st){
      var cov = st.cover ? '<img class="cv" src="' + esc(st.cover) + '" alt="">'
                         : '<div class="cv"></div>';
      return '<button class="bk" type="button" data-id="' + st.id + '">' + cov +
             '<div class="ttl">' + esc(st.title || st.request || 'A story') +
             '<span class="sub">' + st.pages + (st.pages === 1 ? ' page' : ' pages') +
             '</span></div></button>';
    }).join('');
  });
}
function closeShelf(){ $('shelf').classList.remove('show'); }

function replay(id){
  setPaused(false);
  resetToIdle();
  setPhase('thinking');
  jpost('/api/story/' + id + '/replay', {}, function(d){
    if (!d) { notice('that story will not open just now'); resetToIdle(); }
  });
}

$('bPause').addEventListener('click', function(){ setPaused(true); });
$('bPlay').addEventListener('click',  function(){ setPaused(false); });
$('bNew').addEventListener('click', newStory);
$('bShelf').addEventListener('click', function(){
  if ($('shelf').classList.contains('show')) closeShelf(); else openShelf();
});
$('troubleGo').addEventListener('click', dismissTrouble);
$('shelfBack').addEventListener('click', closeShelf);
// The list fills the whole overlay, so a tap on the empty space below the
// books lands on the list, not the backdrop. Both have to close it.
['shelf','shelfList'].forEach(function(id){
  $(id).addEventListener('click', function(e){ if (e.target === $(id)) closeShelf(); });
});
$('shelfList').addEventListener('click', function(e){
  var b = e.target && e.target.closest ? e.target.closest('.bk') : null;
  if (!b) return;
  closeShelf();
  replay(Number(b.getAttribute('data-id')));
});

/* ======================================================================
   Go
   ====================================================================== */
setPhase('idle');
if (!DEMO) connect();
// ?demo=1&go runs the fake story without a hand on the keyboard, which is how
// the page turn and the workshop get reviewed on a machine with no device.
// A trouble demo needs no &go: the card is the whole of what it shows.
if (DEMO && (TROUBLE[DEMO_MODE] || /[?&]go\b/.test(location.search)))
  setTimeout(function(){ ask('a dragon who is scared of the dark'); }, 400);
// Focus the field on a desktop only; on a tablet this would raise the
// on-screen keyboard over the candle, which is exactly wrong at bedtime.
if (!('ontouchstart' in window)) { try{ $('field').focus(); }catch(e){} }

})();
</script>
</body>
</html>
