<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Story Lantern</title>
<!--
==========================================================================
  STORY LANTERN - the lamp display.  One file. No framework, no CDN, no build.
  Served by lantern.py at  GET /show   (static/show.html)

  ------------------------------------------------------------------
  SERVER CONTRACT  (this is what the integrator must provide)
  ------------------------------------------------------------------
  GET  /events            text/event-stream, no buffering, keep-alive.
  POST /api/request       {"text": "..."}   -> 202 {"ok":true}   start a story
  POST /api/stop          {}                -> 200               stop now
  GET  /api/state         optional. Same body as the `hello` event. Used only
                          as a fallback if SSE dies repeatedly; a 404 here is
                          harmless and stays invisible. It may also carry
                          "reason" (see `end`), which is the only way a failure
                          reaches the display while the event stream is down.
  GET  /media/<story>/... the image_url / audio_url paths handed out in events.
  GET  /media/pageturn.wav  optional 4s ambience for the stall case. 404 is fine.

  EVENTS (named SSE events, JSON payloads).  Every one of them is optional and
  arriving twice is safe - the page is idempotent by page index.

    hello   {state, story:{story_id,title,page_count}|null, pages:[page,...],
             current_idx?:int}
              Sent immediately on connect so a browser refresh (or a kiosk
              restart mid-story) resumes exactly where it was. Include
              current_idx - the page being READ, not the newest one prefetched
              - or the display resumes on a page the story hasn't reached.
    state   {state:"idle"|"listening"|"thinking"|"telling"|"ending", line?:"..."}
              `line` is optional human copy shown while thinking, e.g. the
              confirmed-back request. Never send error text here.
    story   {story_id, title, page_count}
    page    {idx, text, image_url|null, audio_url|null, last?:bool}
              May arrive out of order and well ahead of display (prefetch).
    notice  {line:"..."}   a soft, human line. NOT an error. e.g.
              "the lantern is dreaming, try again in a moment"
    end     {reason:"finished"|"stopped"|"failed"
             |"no_storyteller"|"device_unreachable", line?:"..."}
              The last two mean the story never began - no storyteller on the
              device, or no device answering. They do NOT say goodnight: they
              raise a calm card that waits for a grown-up, and they ignore
              `line`, so a sentence written for a parent cannot reach a child
              even if the server sends one.
    trouble {reason:"no_storyteller"|"device_unreachable"}
              Optional alias for those two, for a server that would rather name
              the frame than overload the ending. Same card either way.
    ping    {}             heartbeat, ignored.

  Field aliases accepted, so a small naming drift in the server can't break the
  demo: idx|index|page, text|prose, image_url|image|img, audio_url|audio.
  An unnamed SSE message carrying {"type":"page",...} is routed the same way.

  ------------------------------------------------------------------
  DEGRADATION RULES (all handled here, none of them show an error)
  ------------------------------------------------------------------
  * image missing / 404 / slow  -> the page is set as prose on a warm paper
    plate inside the same window. It looks deliberate, not broken.
  * audio missing / blocked     -> the page holds for a read-time computed from
    its word count, so the story still turns itself.
  * next page not ready         -> the current illustration HOLDS, the glow
    breathes, optional ambience loops. No spinner, ever, at any point.
  * SSE drops                   -> EventSource reconnects silently; after
    repeated failures we quietly poll /api/state.
  * no storyteller / no device  -> the one failure that is NOT degradable: the
    lantern cannot begin at all. A card asks for a grown-up and waits there.

  ?demo=1 renders a fake three-page story with canvas-painted plates so the
  visuals can be reviewed with no device attached. ?demo=no_storyteller and
  ?demo=device_unreachable play the bad night the same way, so the card can be
  looked at without arranging a real failure.
==========================================================================
-->
<style>
/* ---------------------------------------------------------------------
   PALETTE
   A candle is not yellow - it is a warm orange core with a cool falloff.
   Everything here is built from a single amber family plus a bone-paper
   family, so the screen reads as ONE lit object in a dark room rather than
   as a UI with a theme. No pure black and no pure white anywhere.
   --------------------------------------------------------------------- */
:root{
  /* What the button bar occupies, in one place: the page column, the page
     dots and the bar itself all measure off these. */
  --barbtn:      clamp(58px,11vmin,86px);
  --barpad:      max(14px, env(safe-area-inset-bottom));
  --barh:        calc(var(--barbtn) + var(--barpad));

  --room:        #0a0705;
  --amber:       #ffb968;
  --amber-hot:   #ffd9a3;
  --amber-deep:  #d9782a;
  --paper:       #f3e6cd;   /* the mat and the plate */
  --paper-deep:  #e2cda6;
  --cream:       #f0e2c6;   /* prose on the dark room */
  --ink:         #33271a;   /* prose on paper */

  /* One serif family for the whole thing. Bookish, present on every OS we
     ship to, and no webfont means no CDN and no flash of unstyled type. */
  --serif: "Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,
           Georgia,"Hoefler Text","Times New Roman",serif;

  --fade: 900ms;            /* still used by the ask and the notice */
  --ease: cubic-bezier(.4,0,.2,1);

  /* The book is two portrait pages side by side. Its height is what the panel
     can spare once the buttons and the running title have taken theirs; the
     width follows from that, because a book has a fixed shape. */
  --bh:    clamp(190px, min(600px, calc(100vh - var(--barh) - 84px), calc((100vw - 7vmin) / 1.38)), 600px);
  --bw:    calc(var(--bh) * 1.38);
  --turn:  1150ms;
  --mat:   clamp(9px, 2.1vmin, 18px);
}
@supports (height: 100svh){
  :root{ --bh: clamp(190px, min(600px, calc(100svh - var(--barh) - 84px), calc((100vw - 7vmin) / 1.38)), 600px); }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--room);
  color:var(--cream);
  font-family:var(--serif);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
body.hush{cursor:none}          /* kiosk: pointer disappears after a few seconds */

/* ---------------------------------------------------------------------
   THE ROOM
   Two fixed layers under everything: a static dark gradient (the room and
   the suggestion of a surface the lantern stands on) and the candle pool,
   whose brightness is the entire status language of this product.
   --------------------------------------------------------------------- */
#room{
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(120vmin 90vmin at 50% 42%, #241408 0%, #150c07 42%, var(--room) 78%),
    linear-gradient(to top, rgba(86,45,16,.42) 0%, rgba(20,11,6,0) 20%);
}
#glow{
  position:fixed; inset:-10%; z-index:1; pointer-events:none;
  background:
    radial-gradient(60vmin 52vmin at 50% 44%, rgba(255,168,78,.34), rgba(255,132,44,.12) 42%, transparent 72%),
    radial-gradient(120vmin 100vmin at 50% 50%, rgba(255,120,30,.08), transparent 70%);
  opacity:.55;
  transition:opacity 2.2s var(--ease);
  animation:breathe 7.5s ease-in-out infinite;
  will-change:opacity,transform;
}
/* Idle = a candle at rest. Thinking = the same candle, leaned into.
   No spinner, no percentage, no words: brightness is the only signal. */
body[data-phase="thinking"] #glow,
body[data-phase="listening"] #glow{ opacity:1; animation-duration:3.1s; }
body[data-phase="telling"]  #glow{ opacity:.34; animation-duration:11s; }
body.waiting #glow{ opacity:.62; animation-duration:5s; }  /* prefetch stall */
body[data-phase="over"] #glow{ opacity:.5; }

@keyframes breathe{
  0%,100%{ opacity:var(--o,.55); transform:scale(1) }
  50%    { transform:scale(1.045) }
}

/* ---------------------------------------------------------------------
   STAGE
   --------------------------------------------------------------------- */
#stage{
  position:relative; z-index:2;
  height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(10px,2.4vmin,30px);
  padding:clamp(10px,2.6vmin,40px);
  padding-bottom:clamp(30px,6vmin,66px);   /* keeps the page dots clear of the prose */
}
/* While a story is on screen the column has to end ABOVE the buttons and
   below the running title, or the last lines of the page are read through a
   wooden button. --barh is what the bar actually occupies. */
body[data-phase="telling"] #stage,
body[data-phase="ending"]  #stage{
  padding-bottom:calc(var(--barh) + clamp(14px,2.4vmin,26px));
  padding-top:clamp(30px,5vmin,52px);
}

/* Running title: a hairline reminder of what we're inside of, from page two
   on. Deliberately almost invisible - it is for the parent, not the child. */
#running{
  position:fixed; top:clamp(10px,2.4vmin,22px); left:0; right:0; z-index:3;
  text-align:center; font-size:clamp(10px,1.5vmin,13px);
  letter-spacing:.22em; text-transform:uppercase; color:var(--amber);
  opacity:0; transition:opacity 1.4s var(--ease); pointer-events:none;
}
#running.on{opacity:.26}

/* ---------------------------------------------------------------------
   THE BOOK - two pages and a sheet between them.
   The sheet's FRONT is the page being read and its BACK is the picture of
   the page you are turning to, which is how a real leaf works: that, and
   not a cross-fade, is what makes the turn read as a book. Everything else
   here is bindery - the fold, the gutter margins, the light running off
   the paper as it lifts.
   --------------------------------------------------------------------- */
#book{
  position:relative; z-index:2;
  width:var(--bw); height:var(--bh);
  perspective:2900px; perspective-origin:50% 46%;
  filter:drop-shadow(0 30px 52px rgba(0,0,0,.8));
  opacity:0; transform:scale(.985);
  transition:opacity 1.1s var(--ease), transform 1.1s var(--ease);
}
body[data-phase="telling"] #book,
body[data-phase="ending"]  #book{ opacity:1; transform:scale(1); }

/* The boards, proud of the paper on every side. */
#book::before{
  content:""; position:absolute; inset:-1.9% -1.5%; border-radius:7px;
  background:linear-gradient(158deg,#5d2f19,#3d1c0d 46%,#2a1309);
  box-shadow:inset 0 0 0 1px rgba(255,196,130,.16),
             inset 0 2px 3px rgba(255,200,140,.14),
             0 0 80px 6px rgba(255,146,52,.12);
}
/* The binding itself: the dark line the two blocks of paper meet at. */
#book::after{
  content:""; position:absolute; top:1.5%; bottom:1.5%; left:50%; width:1px; z-index:6;
  transform:translateX(-.5px); pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(30,16,6,.85) 12%,rgba(30,16,6,.85) 88%,transparent);
}

.side{ position:absolute; top:0; height:100%; width:50%; overflow:hidden }
.side.l{ left:0;  border-radius:4px 0 0 4px }
.side.r{ right:0; border-radius:0 4px 4px 0 }

/* One stock for every page face. */
.face{
  position:absolute; inset:0; overflow:hidden; backface-visibility:hidden;
  background:
    repeating-linear-gradient(96deg, rgba(120,86,44,.045) 0 1px, transparent 1px 3px),
    radial-gradient(130% 110% at 40% 8%, #fdf4e2 0%, var(--paper) 52%, #e8d6b4 100%);
}
/* The gutter. Two pages with no fold between them read as one flat sheet,
   which is the single thing that stops a spread looking like a book. Paper
   darkens fast in the last few percent and carries a thin highlight where
   it turns back up out of the binding. */
.face.l::after,.face.r::after{
  content:""; position:absolute; top:0; bottom:0; width:22%; pointer-events:none; z-index:3;
}
.face.l::after{ right:0; background:
  linear-gradient(90deg,transparent 0%,rgba(74,46,18,.06) 52%,rgba(74,46,18,.26) 84%,rgba(52,31,11,.62) 100%),
  linear-gradient(90deg,transparent 94%,rgba(255,240,214,.34) 97%,transparent 98%) }
.face.r::after{ left:0; background:
  linear-gradient(270deg,transparent 0%,rgba(74,46,18,.06) 52%,rgba(74,46,18,.26) 84%,rgba(52,31,11,.62) 100%),
  linear-gradient(270deg,transparent 94%,rgba(255,240,214,.34) 97%,transparent 98%) }

/* Asymmetric margins, the way a bound book is set: the gutter side gets the
   wider one because the fold eats it. */
.art{
  position:absolute; inset:6% 12% 6% 6.5%; border-radius:2px; overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,.5), 0 6px 16px -6px rgba(74,46,18,.5);
}
.art img{
  width:100%; height:100%; object-fit:cover; display:block;
  animation:drift 34s ease-out both; transform-origin:52% 48%;
}
.face.alt .art img{ animation-name:driftB; transform-origin:44% 56% }
@keyframes drift { from{transform:scale(1.005)} to{transform:scale(1.045) translate(-1%,-.8%)} }
@keyframes driftB{ from{transform:scale(1.005)} to{transform:scale(1.045) translate(1%,.7%)} }

/* No illustration for this page. Not an error state: a printed book with a
   plate that simply was not made, keyline and ornament and all. */
.blank{
  position:absolute; inset:6% 12% 6% 6.5%; display:none;
  align-items:center; justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(120,86,44,.3);
}
.face.noart .art{ display:none }
.face.noart .blank{ display:flex }
.blank::before{
  content:""; width:42%; height:4px;
  background-image:
    radial-gradient(circle, var(--amber-deep) 0 2px, transparent 2.4px),
    linear-gradient(90deg, transparent, rgba(150,96,40,.5) 22%, rgba(150,96,40,.5) 78%, transparent);
  background-size:100% 100%, 100% 1px;
  background-position:center, center; background-repeat:no-repeat; opacity:.75;
}

/* The text page. fit() moves the font-size on .in until the block cannot
   be clipped, exactly as it did under the old plate. */
.txt{
  position:absolute; inset:9% 8% 12% 14%;
  display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink);
}
.r .txt{ inset:9% 8% 12% 14% }
.txt .in{ font-size:clamp(12px,2.3vmin,20px) }
.txt p{ font-size:1em; line-height:1.62; text-wrap:pretty }
/* Page one only: the title is hand-set above the first words, once. */
.txt .t{
  display:block; font-size:1.52em; line-height:1.22; margin-bottom:.55em;
  color:#4a3721; letter-spacing:.004em;
}
.txt .t::after{
  content:""; display:block; width:4.6em; height:4px; margin:.42em auto .1em;
  background-image:
    radial-gradient(circle, var(--amber-deep) 0 1.7px, transparent 2px),
    linear-gradient(90deg, transparent, rgba(150,96,40,.55) 22%, rgba(150,96,40,.55) 78%, transparent);
  background-size:100% 100%, 100% 1px;
  background-position:center, center; background-repeat:no-repeat; opacity:.8;
}
.num{ position:absolute; bottom:4.2%; font-size:clamp(9px,1.35vmin,12px); color:#8a7150; opacity:.7 }
.l .num{ left:9% } .r .num{ right:9% }

/* THE SHEET. */
#leaf{
  position:absolute; top:0; left:50%; width:50%; height:100%;
  transform-origin:left center; transform-style:preserve-3d;
  z-index:5; border-radius:0 4px 4px 0;
}
#leaf .face.back{ transform:rotateY(180deg) }
/* The outer edge, lit while the sheet stands up. */
#leaf .face::before{
  content:""; position:absolute; top:0; bottom:0; right:0; width:3px; z-index:4;
  pointer-events:none; background:linear-gradient(90deg,transparent,rgba(255,228,182,.55)); opacity:0;
}
.sheen{
  position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0;
  backface-visibility:hidden; mix-blend-mode:multiply;
  background:linear-gradient(93deg, rgba(38,22,8,.62), rgba(140,96,44,.12) 44%, rgba(40,24,9,.5));
}
#leaf.go{ animation:flip var(--turn) cubic-bezier(.36,.06,.28,1) forwards }
#leaf.go .face.front .sheen{ animation:dim  var(--turn) cubic-bezier(.36,.06,.28,1) forwards }
#leaf.go .face.back  .sheen{ animation:lit  var(--turn) cubic-bezier(.36,.06,.28,1) forwards }
#leaf.go .face::before{       animation:edge var(--turn) cubic-bezier(.36,.06,.28,1) forwards }
@keyframes flip{ from{transform:rotateY(0)} to{transform:rotateY(-180deg)} }
@keyframes dim { from{opacity:0} to{opacity:.92} }
@keyframes lit { from{opacity:.95} 74%{opacity:.28} to{opacity:0} }
@keyframes edge{ 0%{opacity:0} 30%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

/* The shadow the lifting sheet throws across the page it uncovers. */
#cast{
  position:absolute; top:0; left:0; width:50%; height:100%; z-index:4; opacity:0;
  pointer-events:none; border-radius:4px 0 0 4px;
  background:linear-gradient(270deg, rgba(28,14,4,.66), rgba(28,14,4,.16) 46%, transparent 76%);
}
#leaf.go ~ #cast{ animation:cast var(--turn) cubic-bezier(.36,.06,.28,1) forwards }
@keyframes cast{ from{opacity:0} 42%{opacity:1} to{opacity:0} }

/* Vignette + grain sit ABOVE everything in the book, the turning sheet
   included. Same light on all of it is what sells it as one object. */
#veil{
  position:absolute; inset:0; pointer-events:none; z-index:6;
  background:
    radial-gradient(115% 115% at 50% 44%, transparent 45%, rgba(30,14,4,.30) 78%, rgba(16,8,3,.62) 100%),
    linear-gradient(to bottom, rgba(255,196,124,.10), transparent 30%, rgba(60,28,8,.16));
  mix-blend-mode:multiply;
}
#grain{
  position:absolute; inset:0; pointer-events:none; opacity:.5; z-index:7;
  background:
    repeating-conic-gradient(from 12deg at 50% 50%, rgba(255,255,255,.035) 0 1deg, transparent 1deg 3deg),
    repeating-linear-gradient(41deg, rgba(0,0,0,.05) 0 1px, transparent 1px 2px),
    repeating-linear-gradient(-38deg, rgba(255,240,214,.045) 0 1px, transparent 1px 3px);
  background-size:9px 9px, 3px 3px, 4px 4px;
  mix-blend-mode:overlay;
}

/* ---------------------------------------------------------------------
   THE CANDLE  - what the window holds when there is no page.
   A teardrop of light with an unhurried flicker. This is the product's
   resting face; it has to be lovely on its own for hours.
   --------------------------------------------------------------------- */
#candle{
  position:fixed; inset:0; z-index:2;
  display:flex; align-items:center; justify-content:center;
  opacity:1; transition:opacity 1.2s var(--ease);
  pointer-events:none;
}
body[data-phase="telling"] #candle,
body[data-phase="ending"]  #candle{ opacity:0 }
#halo{
  position:absolute; left:50%; top:50%;
  width:min(64vmin,520px); height:min(64vmin,520px);
  transform:translate(-50%,calc(-50% - 5vmin));
  background:radial-gradient(closest-side, rgba(255,186,102,.30), rgba(255,140,50,.11) 46%, transparent 74%);
  animation:flicker 3.7s ease-in-out infinite;
}
/* The flame is a square with three rounded corners turned 45° - the only
   shape plain CSS makes that genuinely tapers to a point. The animation
   lives on the container so the rotation on ::after stays put and rides
   along with it. */
#flame{
  position:relative;
  width:clamp(38px,6.6vmin,64px); height:clamp(38px,6.6vmin,64px);
  margin-bottom:10vmin;
  transform-origin:50% 100%;
  animation:flame 2.9s ease-in-out infinite;
}
#flame::after{
  content:""; position:absolute; inset:0;
  border-radius:6% 50% 50% 50%;
  /* read right-to-left: turn the sharp corner to the top, then stretch the
     whole teardrop along the vertical - a flame is taller than it is wide. */
  transform:scaleY(1.24) rotate(45deg);
  background:radial-gradient(circle at 64% 64%,
    #fffaf0 0%, var(--amber-hot) 13%, var(--amber) 31%, var(--amber-deep) 60%, rgba(163,58,8,.66) 90%);
  box-shadow:0 0 30px 8px rgba(255,150,60,.28);
  filter:blur(.6px);            /* a flame has no hard edge */
}
#flame::before{ /* the pool of light the flame stands in */
  content:""; position:absolute; left:50%; bottom:-16%;
  width:190%; height:44%; transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(255,172,84,.5), rgba(255,140,50,.14) 55%, transparent 78%);
}
@keyframes flame{
  0%,100%{ transform:scaleY(1)    scaleX(1)    translateX(0) }
  27%    { transform:scaleY(1.08) scaleX(.955) translateX(-2%) }
  53%    { transform:scaleY(.94)  scaleX(1.04) translateX(1.5%) }
  76%    { transform:scaleY(1.05) scaleX(.98)  translateX(-.8%) }
}
@keyframes flicker{ 0%,100%{opacity:.9} 40%{opacity:1} 65%{opacity:.78} }
body[data-phase="thinking"] #flame{ animation-duration:1.5s }
body[data-phase="thinking"] #halo { animation-duration:1.9s }

/* The prose used to have its own column under the plate. It is set on the
   right-hand page now, so all that is left here is the live region a screen
   reader reads each page from - visually nothing. */
#prose{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
}

/* Page dots: a book's ribbon, not a progress bar. Barely there. */
#dots{
  position:fixed; bottom:clamp(12px,2.6vmin,26px); left:0; right:0; z-index:3;
  display:flex; gap:7px; justify-content:center;
  opacity:0; transition:opacity 1.2s var(--ease); pointer-events:none;
}
body[data-phase="telling"] #dots.on{opacity:.24}
/* The ribbon sat exactly where the buttons now are. */
body[data-phase="telling"] #dots,
body[data-phase="ending"]  #dots{ bottom:calc(var(--barh) + clamp(8px,1.4vmin,15px)) }
#dots i{ width:5px; height:5px; border-radius:50%; background:var(--cream); opacity:.35 }
#dots i.now{ opacity:1; background:var(--amber) }

/* ---------------------------------------------------------------------
   THE ASK - one line of invitation and a hairline field.
   It is the only interactive thing on screen and it leaves as soon as the
   story starts, so the object stops being a computer.
   --------------------------------------------------------------------- */
/* The ask is taken OUT of the column flow deliberately: while a story is
   telling it is invisible, and if it still occupied a row it would steal a
   hundred pixels from the prose on a short kiosk panel - which is exactly
   where the prose can least afford it. */
#ask{
  position:absolute; left:0; right:0; bottom:clamp(12px,3vmin,40px); z-index:3;
  display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.7vmin,18px);
  transition:opacity 900ms var(--ease), transform 900ms var(--ease);
}
#ask.gone{ opacity:0; transform:translateY(10px); pointer-events:none; }
/* At rest the ask belongs to the candle, not to the bottom edge of a screen. */
body[data-phase="idle"] #ask,
body[data-phase="over"] #ask{ bottom:min(20vh,190px) }
/* On "Goodnight." the line stays and the field goes: the last thing on the
   screen at the end of a bedtime story should not be a text box. */
body[data-phase="over"] #field{ opacity:0; pointer-events:none }
#invite{
  font-size:clamp(17px,2.8vmin,25px); color:#f4dfba; opacity:.9;
  text-shadow:0 1px 8px rgba(0,0,0,.6); letter-spacing:.01em;
}
#field{
  width:min(34ch,80vw);
  font:italic 400 clamp(15px,2.3vmin,21px)/1.5 var(--serif);
  color:#ffeccd; text-align:center;
  background:transparent; border:0; border-bottom:1px solid rgba(255,185,104,.34);
  padding:.42em .6em .3em; outline:none;
  transition:border-color .5s var(--ease), box-shadow .5s var(--ease), opacity .8s var(--ease);
  user-select:text;
}
#field::placeholder{ color:rgba(244,223,186,.38) }
#field:focus{ border-bottom-color:rgba(255,185,104,.85); box-shadow:0 8px 22px -14px rgba(255,168,78,.9) }

/* A soft, human line for the awkward moments. Never red, never a dialog. */
#notice{
  position:fixed; left:0; right:0; bottom:clamp(34px,7vmin,64px); z-index:4;
  text-align:center; font-style:italic; color:var(--amber);
  font-size:clamp(14px,2vmin,18px); opacity:0;
  transition:opacity 1s var(--ease); pointer-events:none;
}
#notice.on{opacity:.72}

/* Echo of what the child asked for, shown while the lantern thinks. It is
   the confirmation that it heard, and it doubles as the only "progress" cue. */
#echo{
  /* Sits exactly where the input line was, so the request visibly takes the
     field's place. Slow to arrive, quick to leave - a long fade-out would
     still be crossing the title of page one when it lands. */
  position:fixed; left:0; right:0; bottom:min(20vh,190px); z-index:3;
  text-align:center; font-style:italic; font-size:clamp(15px,2.4vmin,22px);
  color:#f6dfb6; opacity:0; transition:opacity .45s var(--ease); pointer-events:none;
  padding:0 8vmin;
}
#echo.on{opacity:.62; transition:opacity 1.4s var(--ease)}

/* ---------------------------------------------------------------------
   SHORT LANDSCAPE (a laptop window, an odd panel). The spread is already
   side by side; it just needs the height back, so the running title and the
   page dots stand down and the book takes what they were using.
   --------------------------------------------------------------------- */
@media (max-height:560px) and (min-aspect-ratio:13/10){
  :root{ --bh: clamp(150px, min(600px, calc(100vh - var(--barh) - 24px), calc((100vw - 5vmin) / 1.38)), 600px); }
  body[data-phase="telling"] #stage,
  body[data-phase="ending"]  #stage{ padding-top:8px }
  #running{ display:none }
  #ask{ position:fixed; bottom:clamp(10px,3vh,24px); left:0; right:0 }
}

/* ---------------------------------------------------------------------
   PORTRAIT. A landscape book on a tall screen gets small, so the type has
   to stop shrinking with it - the words matter more than the shape does.
   --------------------------------------------------------------------- */
@media (max-aspect-ratio:1/1){
  .txt{ inset:7% 6% 10% 11% }
  .txt .in{ font-size:clamp(11px,3.1vmin,18px) }
  .art,.blank{ inset:5% 9% 5% 5% }
}

/* ---------------------------------------------------------------------
   REDUCED MOTION - no drift, no breathing, no flicker. Cross-fades stay
   (a hard cut between pages is harsher than a fade) but they get short.
   --------------------------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  :root{ --fade:260ms; --turn:260ms }
  /* No page turn: back to the cross-fade it replaced. */
  .layer.turn-out,.layer.turn-in,.layer.turn-out .sheen{ animation:none !important }
  .layer.turn-out{ opacity:0 }
  .layer.turning .back,.layer.turning .sheen{ display:none }
  #glow,.layer img,#flame,#halo{ animation:none !important }
  #frame{ transition-duration:.3s }
  .layer img{ transform:none }
}

/* ======================================================================
   Controls and the shelf
   Three big round buttons a five-year-old can hit without aiming, plus the
   shelf of stories already told. They fade out while a page is being read so
   they never compete with the illustration, and come back on a tap.
   ====================================================================== */
#bar{position:fixed;left:0;right:0;bottom:var(--barpad);
  display:flex;gap:clamp(14px,3.2vmin,26px);justify-content:center;z-index:60;
  opacity:0;pointer-events:none;transition:opacity 420ms var(--ease)}
#bar.show{opacity:1;pointer-events:auto}
.kb{-webkit-appearance:none;appearance:none;border:0;cursor:pointer;position:relative;
  width:var(--barbtn);height:var(--barbtn);border-radius:50%;
  display:grid;place-items:center;font-family:var(--serif);color:var(--ink);
  background:radial-gradient(circle at 34% 28%, #fff8e8, var(--paper) 62%, var(--paper-deep));
  box-shadow:0 3px 0 rgba(120,84,40,.45), 0 8px 22px rgba(0,0,0,.4),
             inset 0 2px 5px rgba(255,255,255,.75);
  transition:transform 130ms var(--ease), box-shadow 130ms var(--ease)}
.kb:active{transform:translateY(3px);
  box-shadow:0 1px 0 rgba(120,84,40,.45), 0 4px 12px rgba(0,0,0,.35),
             inset 0 2px 5px rgba(255,255,255,.6)}
.kb svg{width:44%;height:44%;fill:var(--ink);opacity:.86}
.kb .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.kb[hidden]{display:none}

#shelf{position:fixed;inset:0;z-index:70;background:rgba(24,14,6,.93);
  display:none;flex-direction:column;padding:clamp(18px,4vmin,40px)}
#shelf.show{display:flex}
#shelf h2{font-family:var(--serif);color:var(--cream);font-weight:400;
  font-size:clamp(19px,3.6vmin,30px);text-align:center;margin:0 0 clamp(14px,3vmin,26px);
  letter-spacing:.02em;opacity:.92}
#shelfList{flex:1;overflow-y:auto;display:grid;gap:clamp(11px,2.2vmin,18px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(136px,22vmin,210px),1fr));
  align-content:start;padding-bottom:clamp(70px,13vmin,110px)}
.bk{cursor:pointer;border:0;padding:0;text-align:left;border-radius:12px;
  overflow:hidden;background:var(--paper);font-family:var(--serif);
  box-shadow:0 5px 16px rgba(0,0,0,.45);transition:transform 140ms var(--ease)}
.bk:active{transform:scale(.965)}
.bk .cv{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--paper-deep)}
.bk .ttl{padding:9px 11px 11px;color:var(--ink);font-size:clamp(13px,2.1vmin,16px);line-height:1.28}
.bk .sub{display:block;margin-top:3px;opacity:.55;font-size:.84em}
#shelfEmpty{color:var(--cream);opacity:.6;text-align:center;font-family:var(--serif);
  padding:clamp(26px,7vmin,60px) 0;font-size:clamp(14px,2.4vmin,18px)}

/* ======================================================================
   The card for a night with no storyteller
   The one screen in the lamp that admits something is wrong. It says the only
   thing a five-year-old can act on - fetch a grown-up - and never the reason,
   because the reason is a model that is not loaded, which is not a thing a
   child can hold. And it waits: no timer takes it away, because the thing
   that fixes it happens in another room and takes as long as it takes.
   ====================================================================== */
#trouble{position:fixed;inset:0;z-index:80;display:none;
  align-items:center;justify-content:center;padding:clamp(18px,5vmin,48px);
  background:radial-gradient(circle at 50% 44%, rgba(28,16,8,.88), rgba(8,5,3,.96) 72%)}
#trouble.show{display:flex;animation:troubleIn 900ms var(--ease) both}
@keyframes troubleIn{from{opacity:0}to{opacity:1}}
#trouble .card{
  max-width:86vw;text-align:center;border-radius:14px;
  padding:clamp(24px,5vmin,44px) clamp(20px,4.5vmin,40px) clamp(20px,4vmin,36px);
  background:radial-gradient(circle at 42% 16%, #fff8e8, var(--paper) 58%, var(--paper-deep));
  box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.4)}
/* The same printed ornament the missing-plate page wears, so the card reads as
   part of the book rather than as a dialog that wandered in from a computer. */
#trouble .orn{
  width:42%;height:4px;margin:0 auto clamp(15px,3vmin,25px);
  background-image:
    radial-gradient(circle, var(--amber-deep) 0 2px, transparent 2.4px),
    linear-gradient(90deg, transparent, rgba(150,96,40,.5) 22%, rgba(150,96,40,.5) 78%, transparent);
  background-size:100% 100%, 100% 1px;
  background-position:center, center; background-repeat:no-repeat; opacity:.75}
/* The measure belongs to the line, not to the box: a width in ch has to be
   read at the size the sentence is actually set in, or the card comes out the
   width of a receipt. Two lines of about thirty characters is a card someone
   reads at a glance from the doorway. */
#troubleLine{
  font-family:var(--serif);color:var(--ink);max-width:31ch;margin:0 auto;
  font-size:clamp(16px,2.7vmin,23px);line-height:1.45;letter-spacing:.005em}
/* One button, and it is the way out. Sized like the bar keys - a thumb, not a
   pointer - because whoever ends up pressing it may well be five. */
#troubleGo{
  -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
  margin-top:clamp(18px,3.6vmin,30px);padding:.62em 1.6em;border-radius:999px;
  font-family:var(--serif);font-size:clamp(15px,2.4vmin,20px);color:#fff4e0;
  background:linear-gradient(180deg,#c6702a,#a4551d);
  box-shadow:0 3px 0 rgba(90,46,14,.55), 0 8px 20px rgba(0,0,0,.35);
  transition:transform 130ms var(--ease), box-shadow 130ms var(--ease)}
#troubleGo:active{transform:translateY(3px);
  box-shadow:0 1px 0 rgba(90,46,14,.55), 0 4px 12px rgba(0,0,0,.3)}
/* The button takes focus on sight so Enter and Space reach it. The browser's
   own ring for that is a blue rectangle, which is the single piece of
   operating system that could ever appear in this room. Same ring, repainted
   in the candle's colours. */
#troubleGo:focus{outline:none}
#troubleGo:focus-visible{outline:2px solid rgba(255,185,104,.85);outline-offset:3px}

/* While the card is up there is nothing to pause and nothing to shelve, and a
   key showing faintly through the scrim reads as a smudge on the glass. */
body.troubled #bar{opacity:0;pointer-events:none}

/* ======================================================================
   The workshop
   Forty seconds pass between the ask and the first page, and a candle that
   just sits there reads as broken. So the lantern shows its work: the beats
   of the story appear as soon as they are written, and the plate being made
   right now says what is happening to it. Every step here is a real event
   off the engine - nothing is a timer pretending to be progress.
   ====================================================================== */
/* Below the flame, never through it. The candle sits a little above centre,
   so anything vertically centred here is read straight across the brightest
   part of the picture. */
#workshop{position:fixed;left:0;right:0;top:53%;bottom:auto;
  z-index:40;display:none;padding:0 clamp(16px,5vw,64px);text-align:center;
  max-height:46vh;overflow:hidden;pointer-events:none}
/* Once the storyboard is up it is the thing to look at; the lamp steps back. */
body.planned #candle{opacity:.32}
/* The title says what is coming now; the echoed request would only sit
   on top of the beats. */
body.planned #echo{opacity:0}
body[data-phase="thinking"] #workshop{display:block}
#wsTitle{font-family:var(--serif);color:var(--cream);opacity:0;
  font-size:clamp(20px,3.4vmin,30px);line-height:1.25;margin-bottom:.5em;
  transition:opacity 1.4s var(--ease)}
#wsTitle.on{opacity:.94}
#wsLine{font-family:var(--serif);color:var(--cream);opacity:.52;
  font-size:clamp(13px,1.9vmin,16px);letter-spacing:.045em;margin-bottom:clamp(16px,3vmin,30px)}
#wsLine i{font-style:normal;opacity:.8}

#wsDots{display:flex;gap:10px;justify-content:center;margin-bottom:clamp(16px,3vmin,30px)}
#wsDots b{width:7px;height:7px;border-radius:50%;background:var(--amber);
  opacity:.25;animation:wsPulse 1.7s var(--ease) infinite}
#wsDots b:nth-child(2){animation-delay:.28s}
#wsDots b:nth-child(3){animation-delay:.56s}
@keyframes wsPulse{0%,100%{opacity:.18;transform:scale(.82)}45%{opacity:.85;transform:scale(1.12)}}

#wsBoard{display:flex;flex-wrap:wrap;gap:clamp(8px,1.5vmin,16px);justify-content:center;
  max-width:min(1120px,94vw);margin:0 auto}
.pl{width:clamp(74px,9.5vmin,116px);opacity:0;transform:translateY(9px);
  animation:wsIn .7s var(--ease) forwards}
.pl .plate{width:100%;aspect-ratio:1/1;border-radius:7px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(243,230,205,.14),rgba(243,230,205,.05));
  box-shadow:inset 0 0 0 1px rgba(243,230,205,.16)}
.pl .plate::after{content:"";position:absolute;inset:0;opacity:0;
  background:radial-gradient(circle at 50% 45%, rgba(255,185,104,.5), transparent 68%);
  transition:opacity .8s var(--ease)}
.pl .beat{font-family:var(--serif);color:var(--cream);opacity:.4;
  font-size:clamp(9px,1.24vmin,11.5px);line-height:1.34;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pl.now .plate{box-shadow:inset 0 0 0 1px rgba(255,185,104,.62),
  0 0 24px rgba(255,185,104,.28)}
.pl.now .plate::after{opacity:1;animation:wsBreathe 2.4s var(--ease) infinite}
.pl.now .beat{opacity:.85}
.pl.done .plate{background:linear-gradient(160deg,rgba(255,185,104,.3),rgba(243,230,205,.1));
  box-shadow:inset 0 0 0 1px rgba(243,230,205,.3)}
.pl.done .beat{opacity:.58}
@keyframes wsIn{to{opacity:1;transform:none}}
@keyframes wsBreathe{0%,100%{opacity:.55}50%{opacity:1}}

/* The way out of the shelf. Toggling the same button closed it, but nothing
   said so - which is a trap, not a control. */
#shelfBack{position:absolute;top:clamp(14px,3vmin,30px);right:clamp(14px,3vmin,30px);
  width:clamp(44px,7vmin,58px);height:clamp(44px,7vmin,58px)}
#shelfBack svg{width:42%;height:42%}
</style>
</head>
<body data-phase="idle">

<div id="room"></div>
<div id="glow"></div>

<div id="running" aria-hidden="true"></div>

<div id="candle"><div id="halo"></div><div id="flame"></div></div>

<main id="stage">
  <div id="book">
    <!-- left page: the picture of the page being read -->
    <div class="side l"><div class="face l" id="pL">
      <div class="art"><img alt=""></div><div class="blank"></div><span class="num"></span>
    </div></div>

    <!-- right page: the words of the page being turned TO, uncovered as the
         sheet lifts off it -->
    <div class="side r"><div class="face r" id="pR">
      <div class="txt"><div class="in"><p></p></div></div><span class="num"></span>
    </div></div>

    <!-- the sheet: its front is what you are reading, its back is the
         picture you are turning to -->
    <div id="leaf">
      <div class="face r front" id="lf">
        <div class="txt"><div class="in"><p></p></div></div><span class="num"></span>
        <div class="sheen"></div>
      </div>
      <div class="face l back" id="lb">
        <div class="art"><img alt=""></div><div class="blank"></div><span class="num"></span>
        <div class="sheen"></div>
      </div>
    </div>
    <div id="cast"></div>
    <div id="veil"></div>
    <div id="grain"></div>
  </div>

  <!-- aria-live so a screen reader gets each page once, as it appears -->
  <div id="prose" aria-live="polite" aria-atomic="true"></div>

  <form id="ask" autocomplete="off">
    <div id="invite">Tell me a story about…</div>
    <input id="field" name="q" type="text" maxlength="160" enterkeyhint="go"
           placeholder="a dragon who's scared of the dark" aria-label="What should the story be about?">
  </form>
</main>

<div id="workshop">
  <div id="wsTitle"></div>
  <div id="wsLine">the lantern is dreaming up your story</div>
  <div id="wsDots"><b></b><b></b><b></b></div>
  <div id="wsBoard"></div>
</div>

<div id="bar">
  <button class="kb" id="bPause" type="button" title="Pause">
    <span class="lbl">Pause</span>
    <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.4" height="16" rx="1.6"/><rect x="13.6" y="4" width="4.4" height="16" rx="1.6"/></svg>
  </button>
  <button class="kb" id="bPlay" type="button" title="Play" hidden>
    <span class="lbl">Play</span>
    <svg viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 .9 1 1.5 1.8 1L20 12.9c.7-.4.7-1.4 0-1.8L9.8 4.2C9 3.7 8 4.3 8 5.2z"/></svg>
  </button>
  <button class="kb" id="bNew" type="button" title="A new story">
    <span class="lbl">A new story</span>
    <svg viewBox="0 0 24 24"><path d="M12 2.6l2.1 5.1 5.5.4-4.2 3.6 1.3 5.3L12 14.2 7.3 17l1.3-5.3L4.4 8.1l5.5-.4z"/></svg>
  </button>
  <button class="kb" id="bShelf" type="button" title="Stories we have told">
    <span class="lbl">Stories we have told</span>
    <svg viewBox="0 0 24 24"><path d="M4 4.5h6.2c.9 0 1.6.7 1.6 1.6V20c0-.9-.7-1.6-1.6-1.6H4zM20 4.5h-6.2c-.9 0-1.6.7-1.6 1.6V20c0-.9.7-1.6 1.6-1.6H20z"/></svg>
  </button>
</div>

<div id="shelf">
  <button class="kb" id="shelfBack" type="button" title="Back">
    <span class="lbl">Back</span>
    <svg viewBox="0 0 24 24"><path d="M18.4 7.1a1.2 1.2 0 0 0-1.7-1.7L12 10.3 7.3 5.4A1.2 1.2 0 0 0 5.6 7.1l4.7 4.9-4.7 4.9a1.2 1.2 0 0 0 1.7 1.7l4.7-4.9 4.7 4.9a1.2 1.2 0 0 0 1.7-1.7L13.7 12z"/></svg>
  </button>
  <h2>Stories we have told</h2>
  <div id="shelfList"></div>
  <div id="shelfEmpty" hidden>No stories yet. Ask for one.</div>
</div>

<div id="trouble" role="alertdialog" aria-labelledby="troubleLine">
  <div class="card">
    <div class="orn" aria-hidden="true"></div>
    <p id="troubleLine">The lantern needs a storyteller. Ask a grown-up to check the Tiiny.</p>
    <button id="troubleGo" type="button">Try again</button>
  </div>
</div>

<div id="echo"></div>
<div id="notice"></div>
<div id="dots"></div>

<script>
"use strict";
(function(){

/* ======================================================================
   Constants and tiny helpers
   ====================================================================== */
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
var FADE    = REDUCED ? 260 : 1150;     // the page turn; must match --turn
var STALL_GIVEUP = 90000;               // UI safety net if the server never
                                        // sends the next page (spec caps the
                                        // server side at 45s; this is slower
                                        // on purpose so the server wins).
var THINK_GIVEUP = 90000;               // nothing at all after asking. A child
                                        // must never be left on a leaning
                                        // candle with no way out.
var WPS = 2.2;                          // words/sec ≈ 132wpm, for read-time
                                        // when narration is unavailable.

var $ = function(id){ return document.getElementById(id); };
var body = document.body;
/* The book. At rest the left page carries the picture of the page being read
   and the sheet's front carries its words; the right page and the sheet's
   back are only dressed during a turn, with the page being turned TO. */
var leaf    = $('leaf');
var faceL   = $('pL');                  // left page  - picture, current
var faceR   = $('pR');                  // right page - words, next
var leafF   = $('lf');                  // sheet front - words, current
var leafB   = $('lb');                  // sheet back  - picture, next

var S = {
  paused: false,
  phase:   'idle',
  story:   null,
  pages:   new Map(),                   // idx -> page record
  current: null,
  turning: false,
  holding: false,
  ended:   false,
  fadeDone:true,
  audioDone:true,
  pending: null,                        // page waiting for both to finish
  timers:  [],                          // session-lifetime timers
  ptimers: [],                          // this-page-only timers
  thinkT:  null,                        // "no story ever arrived" clock
  lastAsk: '',                          // the wish, kept to hand back
  troubleKey: null                      // the failure the card is already up for
};

/* Two timer pools, deliberately. The page clock (ptimers) is torn down every
   time a new page starts reading; everything else - image-settle polls, the
   notice auto-hide, the goodnight chain - lives on the session pool and must
   survive a page turn. Sharing one pool silently cancelled pending pages. */
/* A story can end mid-turn - the child changes their mind, or the engine
   stops. Strip the leaf classes or the next story inherits a page frozen at
   168 degrees. */
function clearTurn(){
  leaf.style.transition = 'none';
  leaf.classList.remove('go');
  void leaf.offsetWidth;
  leaf.style.transition = '';
}
function clearPageTimers(){ S.ptimers.forEach(clearTimeout); S.ptimers = []; }
/* Page timers tick rather than sleep: a pause landing mid-dwell has to stop the
   clock that turns the page, not just the voice. 250ms granularity is far finer
   than anything it measures (the shortest dwell is 1.2s).
   ponytail: no elapsed-time bookkeeping anywhere else - this is the one place
   that knows a page can be held. */
function pageLater(fn, ms){
  var left = ms, last = Date.now(), id;
  function tick(){
    var now = Date.now();
    if (!S.paused) left -= (now - last);
    last = now;
    if (left <= 20) return fn();
    id = setTimeout(tick, Math.min(250, left)); S.ptimers.push(id);
  }
  id = setTimeout(tick, Math.min(250, ms)); S.ptimers.push(id);
  return id;
}
function clearTimers(){ clearPageTimers(); S.timers.forEach(clearTimeout); S.timers = []; }
function later(fn, ms){ var t = setTimeout(fn, ms); S.timers.push(t); return t; }
function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function words(t){ return String(t||'').trim().split(/\s+/).filter(Boolean).length; }
function readTime(t){ return Math.max(6000, (words(t)/WPS)*1000 + 1800); }

function setPhase(p){
  S.phase = p;
  body.setAttribute('data-phase', p);
  updateBar();

  /* There is a 90s net for a mid-story stall but nothing ever watched the
     thinking phase. The engine's plan call can legitimately run two chat
     attempts of up to 420s HTTP each plus a 150004 backoff ride apiece, so a
     wedged or heavily contended device left a child staring at a leaning
     candle for many minutes with no story, no goodnight, and no way out but a
     grown-up. Arm a clock; end warmly if no page ever arrives. */
  clearTimeout(S.thinkT);
  if (p === 'thinking'){
    S.thinkT = setTimeout(function(){
      if (S.phase === 'thinking' && !S.current && !S.ended){
        notice('the lantern is dreaming, ask me again in a moment', 9000);
        // Tell the engine to let go too, or a story that finally lands 5
        // minutes later starts narrating into an idle bedroom.
        if (!DEMO) jpost('/api/stop', {}, function(){});
        finish();
      }
    }, THINK_GIVEUP);
  }
  // The ask leaves the moment a story exists and comes back when it's over.
  var hide = (p === 'thinking' || p === 'listening' || p === 'telling' || p === 'ending');
  $('ask').classList.toggle('gone', hide);
  // The echo of the child's request belongs to the waiting, and to nothing
  // else - once the first page is up it would sit on top of the prose.
  if (p !== 'thinking' && p !== 'listening') $('echo').classList.remove('on');
}

function notice(line, ms){
  var n = $('notice');
  if (!line){ n.classList.remove('on'); return; }
  n.textContent = line;
  n.classList.add('on');
  later(function(){ n.classList.remove('on'); }, ms || 7000);
}

/* The two nights the lantern cannot start at all.
   These are different in kind from every other failure: there is no
   storyteller loaded on the device, or the device is not answering, and
   nothing the child does fixes either. Goodnight would be a lie that ends the
   evening while a grown-up could still start it, and a notice would fade out
   before anyone walked in. So the card waits instead, in the lantern's own
   words. The engine's sentence for a grown-up names models and belongs at
   /parent; it is never rendered here, which is why `line` is ignored. */
var TROUBLE = {
  no_storyteller:     'The lantern needs a storyteller. Ask a grown-up to check the Tiiny.',
  device_unreachable: 'The lantern cannot hear the Tiiny. Ask a grown-up to check it.'
};

function showTrouble(reason, storyId){
  var line = TROUBLE[reason];
  if (!line) return;
  /* The poll fallback re-reads the same failed state every 2.5 seconds, and a
     card that comes straight back cannot be dismissed. One key per failure
     guards the repeat and the dismissal both: it is cleared by the next ask,
     so the same trouble twice in one evening still shows twice. */
  var key = reason + ':' + (storyId == null ? '' : storyId);
  if (S.troubleKey === key) return;
  S.troubleKey = key;
  /* Put the candle and the prompt back underneath first, so dismissing the
     card is only the card leaving. The wish stays in the field: if a grown-up
     loads the model, Try again should not also mean ask again. */
  var wish = S.lastAsk;
  closeShelf();
  resetToIdle();
  if (wish) $('field').value = wish;
  $('troubleLine').textContent = line;
  $('trouble').classList.add('show');
  body.classList.add('troubled');
  try{ $('troubleGo').focus(); }catch(e){}
}

function dismissTrouble(){
  $('trouble').classList.remove('show');
  body.classList.remove('troubled');
  if (!('ontouchstart' in window)) { try{ $('field').focus(); }catch(e){} }
}

/* ======================================================================
   Audio
   Each page owns its own <audio>, created as soon as the page arrives so
   the file is already buffered when its turn comes. Two live at most.
   ====================================================================== */
var unlocked = false;
function silentWavUrl(){
  // 0.1s of silence, built in-page so there is no asset and no base64 to typo.
  // Spec §8.7: play this on the first gesture to unlock audio on browsers
  // that ignore the kiosk autoplay flag.
  var rate = 8000, n = 800, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf), i;
  function str(o, s){ for (i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
  str(0,'RIFF'); v.setUint32(4, 36+n*2, true); str(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40, n*2, true);
  try { return URL.createObjectURL(new Blob([buf], {type:'audio/wav'})); } catch(e){ return null; }
}
function unlockAudio(){
  if (unlocked) return;
  unlocked = true;
  try {
    var u = silentWavUrl(); if (!u) return;
    var a = new Audio(u); a.volume = 0;
    var p = a.play(); if (p && p.catch) p.catch(function(){});
  } catch(e){ /* nothing to do; narration simply may not autoplay */ }
}

var ambience = null;
function ambienceOn(){
  // Optional bundled page-turn sound for the stall case. If the file isn't
  // there, this fails silently and the stall is just a quiet held page.
  try{
    if (!ambience){ ambience = new Audio('/media/pageturn.wav'); ambience.loop = true; ambience.volume = .28; }
    var p = ambience.play(); if (p && p.catch) p.catch(function(){});
  }catch(e){}
}
function ambienceOff(){ try{ if (ambience){ ambience.pause(); ambience.currentTime = 0; } }catch(e){} }

function prepAudio(pg){
  if (!pg.audio_url || pg._audio) return;
  try{
    var a = new Audio();
    a.preload = 'auto';
    a.src = pg.audio_url;
    a.addEventListener('error', function(){ pg._audioFailed = true; });
    pg._audio = a;
  }catch(e){ pg._audioFailed = true; }
}
function stopAudio(pg){
  if (pg && pg._audio){
    try{ pg._audio.pause(); }catch(e){}
    pg._audio.onended = null; pg._audio.ontimeupdate = null; pg._audio.onerror = null;
  }
}

/* Everything a story leaves behind. Called when the child changes their mind
   mid-story: the server stops the old session first, which publishes an `end`
   frame and drives finish() - so without this the NEW story's title and any of
   its pages that had already arrived were discarded ~10s later by resetToIdle,
   and a page 0 landing inside that window was swallowed permanently. */
function teardownStory(){
  clearTimers(); clearTimeout(S.thinkT); ambienceOff();
  S.pages.forEach(stopAudio);
  S.pages = new Map();
  S.current = null; S.pending = null;
  S.paused = false; body.classList.remove('paused');
  S.turning = false; S.holding = false; S.ended = false;
  clearTurn();
  S.fadeDone = true; S.audioDone = true;
  body.classList.remove('waiting');
}

/* ======================================================================
   Images
   Preloaded and decoded BEFORE the cross-fade starts, so a page never
   fades in half-painted. A failure or a slow load just flips the page to
   the prose-on-paper treatment - which is a design, not an error state.
   ====================================================================== */
function prepImage(pg, then){
  if (pg._imgState || !pg.image_url){ if (!pg.image_url) pg._imgState = 'none'; return; }
  pg._imgState = 'loading';
  var im = new Image();
  var done = false;
  var give = setTimeout(function(){ if(!done){ done = true; pg._imgState = 'none'; } }, 12000);
  im.onload  = function(){ if(done) return; done = true; clearTimeout(give); pg._imgState = 'ok'; pg._img = im;
                           if (then) then(pg); };
  im.onerror = function(){ if(done) return; done = true; clearTimeout(give); pg._imgState = 'none'; };
  im.src = pg.image_url;
}
/* The engine ships a page the moment it has a voice and paints it ~8 seconds
   later, on purpose - the voice is what starts the page. The late `page` frame
   carrying image_url was merged and the image was even preloaded, but nothing
   ever put it on screen, so a page displayed before its art simply kept the
   prose-on-paper treatment for its whole turn. On a live story that is most
   pages, which is why the lamp looked like it never made pictures. Cross-fade
   the same page into the other layer: identical prose, so all that visibly
   changes is that the picture arrives. */
function artArrived(pg){
  if (S.ended || pg._imgState !== 'ok') return;
  // Mid-turn, the page this art belongs to is the one on the back of the
  // sheet; at rest it is the left page. Either way it is the same picture
  // arriving late onto a page already in front of the child.
  if (S.turning && S.pending === pg){ dressArt(leafB, pg); return; }
  if (S.current === pg && !S.turning)  dressArt(faceL, pg);
}

function imageSettled(pg){ return pg._imgState === 'ok' || pg._imgState === 'none' || !pg.image_url; }

/* ======================================================================
   Dressing a page
   Two faces, never a whole "slot": a picture face and a words face. The turn
   moves which faces are showing; these only fill them.
   ====================================================================== */
function dressArt(face, pg){
  var img = face.querySelector('.art img');
  face.classList.toggle('alt', (pg.idx % 2) === 1);   // alternate the drift
  if (pg._imgState === 'ok' && pg.image_url){
    face.classList.remove('noart');
    img.src = pg.image_url;
    img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
  } else {
    // No plate for this page. Not an error: a printed book with a picture
    // that was never made, keyline and ornament and all.
    face.classList.add('noart');
    img.removeAttribute('src');
  }
  face.querySelector('.num').textContent = pg.idx * 2 + 1;
}

function dressText(face, pg){
  var box = face.querySelector('.txt');
  var inn = box.querySelector('.in');
  var isFirst = (pg.idx === 0);
  var title = (S.story && S.story.title) ? S.story.title : '';
  inn.innerHTML = (isFirst && title ? '<span class="t">' + esc(title) + '</span>' : '') +
                  '<p>' + esc(pg.text) + '</p>';
  fit(box, inn);
  face.querySelector('.num').textContent = pg.idx * 2 + 2;
}

/* Both faces of the spread the child is looking at. */
function dress(pg){
  dressArt(faceL, pg);
  dressText(leafF, pg);
  $('prose').textContent = pg.text;          // the screen-reader's copy
  if (pg.idx > 0 && S.story && S.story.title){
    $('running').textContent = S.story.title; $('running').classList.add('on');
  }
  drawDots(pg.idx);
}

/* Shrink one wrapper until its block fits its box. A bedtime page is 55-70
   words but the model will occasionally hand us 90, and a clipped last line
   is the one typographic failure a parent WILL notice. Cheap insurance:
   at most 40 one-pixel steps, run on a hidden layer before it fades in. */
function fit(box, inner){
  if (!box || !inner) return;
  inner.style.fontSize = '';                    // back to the CSS clamp value
  var max = parseFloat(getComputedStyle(inner).fontSize) || 20;
  var cs  = getComputedStyle(box);
  var avail = box.clientHeight -
              (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  if (avail <= 0) return;
  var size = max, guard = 0;
  while (inner.offsetHeight > avail && size > 11 && guard++ < 40){
    size -= 1;
    inner.style.fontSize = size + 'px';
  }
}

// Refit both layers when the window changes (kiosk rotation, a resized
// laptop window). Debounced; cheap enough to be unnoticeable.
var refitT = null;
window.addEventListener('resize', function(){
  clearTimeout(refitT);
  refitT = setTimeout(function(){
    [faceR, leafF].forEach(function(face){
      var box = face.querySelector('.txt');
      if (box) fit(box, box.querySelector('.in'));
    });
  }, 180);
});

function drawDots(idx){
  var total = (S.story && S.story.page_count) || S.pages.size || 0;
  var d = $('dots');
  if (!total){ d.classList.remove('on'); return; }
  var h = '';
  for (var i = 0; i < total; i++) h += '<i class="' + (i === idx ? 'now' : '') + '"></i>';
  d.innerHTML = h; d.classList.add('on');
}

/* ======================================================================
   Turning the page
   The sheet starts moving FADE ms before narration ends, so the new spread
   is settled exactly as the last word lands. If the next page isn't ready we
   hold the current one - never a gap, never a spinner.
   ====================================================================== */
function show(pg, immediate){
  if (immediate){
    // A resync, or the first page of a story: no sheet, the book simply IS
    // this page. This path skips maybeStart's audioDone gate, so nothing
    // else stops a voice that is already going - without it one reconnect
    // restarted narration on top of the page being read.
    if (S.current && S.current !== pg) stopAudio(S.current);
    clearTurn();
    dress(pg);
    S.current = pg; S.turning = false;
    S.pending = null; S.fadeDone = true;
    startNarration(pg);
    return;
  }

  S.turning = true;
  S.fadeDone = false;
  // Dress the far side of the sheet and the page beneath it BEFORE it moves:
  // the back of a leaf is the picture you are turning to, and under the leaf
  // are the words that go with it.
  dressArt(leafB, pg);
  dressText(faceR, pg);
  leaf.classList.add('go');
  S.current = pg;
  S.pending = pg;
  later(function(){
    // The sheet has landed. Commit: the left page becomes what the sheet's
    // back was showing and the sheet snaps back to zero carrying this page's
    // words - which is already exactly what is printed underneath it, so
    // nothing flickers as it goes.
    dress(pg);
    clearTurn();
    S.fadeDone = true; S.turning = false; maybeStart();
  }, FADE);
}

function maybeStart(){
  // Narration for the incoming page begins only once BOTH the fade has
  // finished and the outgoing narration has actually stopped, so two voices
  // never overlap and there is still no silence gap of any length.
  if (!S.pending || !S.fadeDone || !S.audioDone) return;
  var pg = S.pending; S.pending = null;
  startNarration(pg);
}

function startNarration(pg){
  clearPageTimers();
  ambienceOff();
  body.classList.remove('waiting');
  S.audioDone = false;

  // Tell the server which page is being READ. This is the signal that releases
  // the producer to build page idx+1 - without it the engine falls back to a
  // 45s stall timer per page and the story visibly limps. Fire-and-forget: a
  // failed report costs a slower prefetch, never a broken page.
  reportProgress(pg.idx);

  // Page one: the hand-set title holds for a beat as the voice begins, then
  // settles into the page text. Same move as the demo - the title floats up,
  // and only then does the reading start under it.
  // Its own timer, not the page pool: if narration fails we fall back to a
  // read-time dwell, which tears the pool down - and the title would be left
  // frozen on screen with the page text never arriving underneath it.
  // The title used to hold the prose box alone for a beat and then cross-fade
  // out of it. On a printed page it just sits above the first words and stays
  // there, which is both simpler and more like a book.

  prepAudio(pg);
  var a = pg._audio;

  var ended = function(){
    if (pg._done) return; pg._done = true;
    S.audioDone = true;
    maybeStart();
    onPageEnd(pg);
  };

  if (a && !pg._audioFailed){
    a.onended = ended;
    a.ontimeupdate = function(){
      if (a.duration && isFinite(a.duration) && (a.duration - a.currentTime) * 1000 <= FADE + 60){
        a.ontimeupdate = null;
        turnEarly(pg);
      }
    };
    a.onerror = function(){ pg._audioFailed = true; fallbackDwell(pg, ended); };
    var p = null;
    // Paused before this page got its voice: the handlers are armed and we
    // simply wait for Play.
    if (!S.paused){ try { p = a.play(); } catch(e){ pg._audioFailed = true; } }
    if (p && p.catch) p.catch(function(){ pg._audioFailed = true; fallbackDwell(pg, ended); });
    if (pg._audioFailed) fallbackDwell(pg, ended);
    // Safety net: if the audio element stalls entirely, still turn the page.
    pageLater(function(){ if (!pg._done) ended(); }, readTime(pg.text) + 45000);
  } else {
    fallbackDwell(pg, ended);
  }
}

function fallbackDwell(pg, ended){
  // No narration: hold the page for a read-time computed from its length so
  // a parent can read it aloud, then turn. Still no error shown anywhere.
  clearPageTimers();
  var d = readTime(pg.text);
  pageLater(function(){ turnEarly(pg); }, Math.max(1200, d - FADE));
  pageLater(function(){ ended(); }, d);
}

function turnEarly(pg){
  if (S.turning || S.ended) return;
  if (S.current !== pg) return;
  var nxt = S.pages.get(pg.idx + 1);
  if (nxt && imageSettled(nxt)) show(nxt, false);
}

function onPageEnd(pg){
  if (S.ended) return;
  if (S.current !== pg) return;      // we already turned early; nothing to do

  var nxt = S.pages.get(pg.idx + 1);
  if (nxt && imageSettled(nxt)){
    if (!S.turning) show(nxt, false);
    return;
  }
  if (pg.last){ finish(); return; }

  // The stall. The illustration holds, the glow leans in, the ambience loops.
  S.holding = true;
  body.classList.add('waiting');
  ambienceOn();
  pageLater(function(){
    if (S.holding && !S.ended) finish();   // UI safety net only
  }, STALL_GIVEUP);
}

function finish(){
  if (S.ended) return;
  S.ended = true; S.holding = false;
  clearPageTimers(); ambienceOff();
  body.classList.remove('waiting');
  setPhase('ending');
  later(function(){
    clearTurn();
    $('running').classList.remove('on');
    $('dots').classList.remove('on');
    setPhase('over');
    $('invite').textContent = 'Goodnight.';
    later(function(){ resetToIdle(); }, 9000);
  }, 1400);
}

function resetToIdle(){
  clearTimers(); clearTimeout(S.thinkT); ambienceOff();
  S.pages.forEach(stopAudio);
  S.pages = new Map(); S.story = null; S.current = null;
  S.paused = false; body.classList.remove('paused');
  S.turning = false; S.holding = false; S.ended = false;
  S.pending = null; S.fadeDone = true; S.audioDone = true;
  clearTurn();
  [faceL, leafB].forEach(function(f){ f.classList.remove('noart','alt');
    f.querySelector('.art img').removeAttribute('src'); });
  [faceR, leafF].forEach(function(f){ f.querySelector('.txt .in').innerHTML = '';
    f.querySelector('.num').textContent = ''; });
  [faceL, leafB].forEach(function(f){ f.querySelector('.num').textContent = ''; });
  $('prose').textContent = '';
  $('running').classList.remove('on'); $('running').textContent = '';
  $('dots').classList.remove('on');    $('dots').innerHTML = '';
  $('echo').classList.remove('on');
  workshopReset();
  body.classList.remove('troubled');
  $('invite').textContent = 'Tell me a story about…';
  $('field').value = '';
  setPhase('idle');
}

/* ======================================================================
   Incoming pages
   ====================================================================== */
/* Fold one incoming page record into S.pages and return it. No side effects on
   what is being shown - that is addPage's job. Split out so `hello` can resync
   the page set without also restarting the story. */
function mergePage(raw){
  var idx  = Number(raw.idx != null ? raw.idx : (raw.index != null ? raw.index : raw.page)) || 0;
  var iurl = raw.image_url || raw.image || raw.img || null;
  var aurl = raw.audio_url || raw.audio || null;

  // Re-delivery of a page we already hold is a MERGE, not a replace, so a
  // server that announces a page's text first and its media a moment later
  // still works. (Sending the page complete is preferred - if the art loses
  // the race to the display, that page shows as prose on paper.)
  var ex = S.pages.get(idx);
  if (ex){
    if (raw.text) ex.text = raw.text;
    if (raw.last) ex.last = true;
    if (iurl && !ex.image_url){ ex.image_url = iurl; ex._imgState = null; prepImage(ex, artArrived); }
    if (aurl && !ex.audio_url){ ex.audio_url = aurl; ex._audioFailed = false; prepAudio(ex); }
    return null;                        // nothing new to start on
  }

  var pg = {
    idx: idx,
    text: raw.text != null ? raw.text : (raw.prose || ''),
    image_url: iurl,
    audio_url: aurl,
    last: !!raw.last
  };
  S.pages.set(pg.idx, pg);
  prepImage(pg);
  prepAudio(pg);

  if (S.story && S.story.page_count && pg.idx === S.story.page_count - 1) pg.last = true;
  return pg;
}

function addPage(raw){
  // A frame from a story the child has already moved on from. The engine can
  // have a producer parked in a 420s device call, and pages merge by index, so
  // index 3 of a dead story would otherwise overwrite index 3 of the live one.
  if (raw.story_id != null && S.story && S.story.story_id != null &&
      raw.story_id !== S.story.story_id) return;

  var pg = mergePage(raw);
  if (!pg) return;

  // First page: begin the story as soon as its art has settled (or failed).
  if (!S.current && pg.idx === 0){
    setPhase('telling');
    waitSettled(pg, function(){ show(pg, true); });
    return;
  }
  // We were holding for exactly this page.
  if (S.holding && S.current && pg.idx === S.current.idx + 1){
    waitSettled(pg, function(){
      if (!S.holding || S.ended) return;
      S.holding = false;
      ambienceOff(); body.classList.remove('waiting');
      show(pg, false);
    });
  }
}

function waitSettled(pg, fn){
  // Give the image a moment to decode; act the instant it settles either way.
  var t0 = Date.now();
  (function poll(){
    if (imageSettled(pg) || Date.now() - t0 > 12500){ fn(); return; }
    later(poll, 120);
  })();
}

/* ======================================================================
   Event routing
   ====================================================================== */
function handle(kind, data){
  try{
    if (kind === 'ping') return;

    if (kind === 'hello'){
      // A state read carrying a trouble reason is a failure that happened
      // while the event stream was down - the poll is the only way it reaches
      // the lamp at all, so it is read before anything else here.
      if (TROUBLE[data.reason]){
        showTrouble(data.reason, data.story && data.story.story_id);
        return;
      }
      // `hello` arrives on EVERY SSE reconnect, and every 2.5s once the poll
      // fallback is running. It used to rebuild S.pages from scratch with brand
      // new page objects and then unconditionally show()+startNarration(),
      // which stacked a fresh <audio> and a fresh voice on top of the one still
      // playing - a chorus, growing every 2.5 seconds. It is a RESYNC, not a
      // restart: merge, and only take over the screen if we are not already on
      // the right page.
      if (data.story){
        if (S.story && S.story.story_id && data.story.story_id &&
            data.story.story_id !== S.story.story_id) teardownStory();
        S.story = data.story;
      }
      var list = data.pages || [];
      if (data.state === 'telling' && list.length){
        list.forEach(mergePage);
        // Prefer the page the child was actually on. Without current_idx we
        // land on the newest page we hold, which can be a prefetched one the
        // story hasn't reached yet - so the server should send it.
        var top = Math.max.apply(null, Array.from(S.pages.keys()));
        var cur = (data.current_idx != null && S.pages.has(Number(data.current_idx)))
                ? S.pages.get(Number(data.current_idx))
                : S.pages.get(top);
        if (!cur) return;
        if (S.current && S.current.idx === cur.idx) return;   // already reading it
        S.pages.forEach(stopAudio);
        prepImage(cur); prepAudio(cur);
        setPhase('telling');
        waitSettled(cur, function(){ show(cur, true); });
      } else if (data.state && data.state !== 'idle'){
        setPhase(data.state === 'planning' ? 'thinking' : data.state);
      }
      return;
    }

    if (kind === 'state'){
      var st = data.state || 'idle';
      if (st === 'idle')      { if (!S.current) resetToIdle(); }
      else if (st === 'planning') setPhase('thinking');
      else                        setPhase(st);
      if (data.line){ $('echo').textContent = data.line; $('echo').classList.add('on'); }
      return;
    }

    if (kind === 'story'){
      // The child changed their mind. The server stops the old session first,
      // which sends `end` and drives finish() - so tear the old story down HERE
      // rather than letting resetToIdle do it ~10s from now, on top of the new
      // story's title and any pages that have already arrived.
      if (S.story && S.story.story_id !== data.story_id) teardownStory();
      S.story = { story_id:data.story_id, title:data.title || '', page_count:data.page_count || 0 };
      workshopPlan(data);
      lastReported = -1;              // a new story restarts the progress report
      setPhase('thinking');
      return;
    }

    if (kind === 'build'){ workshopStage(data); return; }

    if (kind === 'page'){ addPage(data); return; }

    if (kind === 'notice'){
      if (data.story_id != null && S.story && S.story.story_id != null &&
          data.story_id !== S.story.story_id) return;
      notice(data.line || data.text || '');
      return;
    }

    if (kind === 'trouble'){ showTrouble(data.reason, data.story_id); return; }

    if (kind === 'end'){
      // Goodnight from a story that is already over and replaced.
      if (data.story_id != null && S.story && S.story.story_id != null &&
          data.story_id !== S.story.story_id) return;
      // A story that never reached page one did not end, it never started, and
      // that gets the card. Every other ending - finished, stopped, or a
      // failure with pages already read - keeps the goodnight it always had.
      if (TROUBLE[data.reason]){ showTrouble(data.reason, data.story_id); return; }
      // The child pressed "a new story": we are already back at the candle and
      // the stop we sent is what produced this frame. Do not re-run goodnight.
      if (S.phase === 'idle') return;
      if (data.line) notice(data.line, 9000);
      if (S.current && !S.ended && data.reason === 'finished'){
        // Let the page in flight finish reading itself out.
        if (S.current) S.current.last = true;
        if (S.audioDone) finish();
      } else {
        finish();
      }
      return;
    }
  }catch(e){
    // A malformed event must never take the screen down.
    if (window.console && console.warn) console.warn('lantern: bad event', kind, e);
  }
}

/* ======================================================================
   Transport: SSE, with a silent poll fallback if it keeps dying.
   ====================================================================== */
var es = null, sseFails = 0, polling = null;
var KINDS = ['hello','state','story','page','build','notice','end','trouble','ping'];

function connect(){
  if (!window.EventSource){ startPolling(); return; }
  try { es = new EventSource('/events'); }
  catch(e){ startPolling(); return; }

  KINDS.forEach(function(k){
    es.addEventListener(k, function(ev){
      var d = {}; try { d = ev.data ? JSON.parse(ev.data) : {}; } catch(x){ d = { line: ev.data }; }
      handle(k, d);
    });
  });
  // Unnamed messages carrying {"type": "..."} are routed the same way.
  es.onmessage = function(ev){
    var d; try { d = JSON.parse(ev.data); } catch(x){ return; }
    if (d && d.type) handle(d.type, d);
  };
  es.onopen  = function(){ sseFails = 0; stopPolling(); };
  es.onerror = function(){
    // EventSource reconnects on its own; we stay quiet about it. Only after
    // it has failed repeatedly do we fall back to polling, still silently.
    sseFails++;
    if (sseFails >= 4) startPolling();
  };
}

function startPolling(){
  if (polling) return;
  polling = setInterval(function(){
    jget('/api/state', function(d){ if (d) handle('hello', d); });
  }, 2500);
}
function stopPolling(){ if (polling){ clearInterval(polling); polling = null; } }

function jget(url, cb){
  var ctl = window.AbortController ? new AbortController() : null;
  var kill = setTimeout(function(){ if (ctl) ctl.abort(); }, 4000);
  fetch(url, { signal: ctl ? ctl.signal : undefined, cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ clearTimeout(kill); cb(d); })
    .catch(function(){ clearTimeout(kill); cb(null); });
}

function jpost(url, obj, cb){
  var ctl = window.AbortController ? new AbortController() : null;
  var kill = setTimeout(function(){ if (ctl) ctl.abort(); }, 8000);
  fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(obj),
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){ clearTimeout(kill); cb(r.ok); })
    .catch(function(){ clearTimeout(kill); cb(false); });
}

/* Reading progress. The engine prefetches exactly one page ahead and waits for
   this before starting page N+1, so that we never hog a device we share with
   another tenant. Silent on every failure. */
var lastReported = -1;
function reportProgress(idx){
  if (DEMO) return;
  if (!S.story || S.story.story_id == null) return;
  if (idx <= lastReported) return;
  lastReported = idx;
  jpost('/api/progress', { story_id: S.story.story_id, idx: idx }, function(){});
}

/* ======================================================================
   The ask
   ====================================================================== */
$('ask').addEventListener('submit', function(e){
  e.preventDefault();
  var t = $('field').value.trim();
  if (t.length < 2) { $('field').focus(); return; }
  unlockAudio();
  ask(t);
});

function ask(text){
  setPhase('thinking');
  // A new wish is a new night: the card that was up for the last one has to be
  // allowed back if the same thing happens again.
  S.lastAsk = text;
  S.troubleKey = null;
  $('echo').textContent = text;
  $('echo').classList.add('on');
  try{ $('field').blur(); }catch(e){}
  if (DEMO){ demoRun(text); return; }
  jpost('/api/request', { text:text }, function(ok){
    if (!ok){
      // The device is busy or the server hiccuped. This is the one place a
      // child sees "no" and it is phrased as the lantern, not as an error.
      notice('the lantern is dreaming, ask me again in a moment', 8000);
      setPhase('idle');
      $('field').value = text;
    }
  });
}

/* Stop: Escape, or a long press of Space (the arcade button), matching the
   spec's physical stop. Never asks for confirmation. */
var spaceDown = 0;
document.addEventListener('keydown', function(e){
  if (e.target === $('field')) return;
  if (e.code === 'Space' && !spaceDown) spaceDown = Date.now();
  if (e.key === 'Escape'){
    if ($('shelf').classList.contains('show')) return closeShelf();
    stopNow();
  }
});
document.addEventListener('keyup', function(e){
  if (e.target === $('field')) return;
  if (e.code === 'Space'){
    var held = Date.now() - spaceDown; spaceDown = 0;
    if (held > 1200) stopNow();
    else if (S.phase === 'idle') $('field').focus();
  }
});
function stopNow(){
  if (S.phase === 'idle' || S.phase === 'over') return;
  S.pages.forEach(stopAudio);
  jpost('/api/stop', {}, function(){});
  finish();
}

/* Kiosk polish: hide the cursor when nothing is moving. */
var hushT = null;
function stirred(){
  body.classList.remove('hush');
  clearTimeout(hushT);
  hushT = setTimeout(function(){ body.classList.add('hush'); }, 4000);
}
['pointermove','pointerdown','keydown'].forEach(function(ev){
  document.addEventListener(ev, stirred, { passive:true });
});
stirred();

/* Any first gesture unlocks audio, in case the kiosk autoplay flag is absent. */
['pointerdown','keydown','touchstart'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, { once:true, passive:true });
});

/* ======================================================================
   ?demo=1 - a fake story with canvas-painted plates, so the look can be
   reviewed with no device on the network. Never runs otherwise.
   ====================================================================== */
/* The value picks which demo: 1 is the fake story, a trouble reason is the
   card. Any value at all means "no device on the network", so the page never
   opens an event stream that nothing is going to answer. */
var DEMO_MODE = (/[?&]demo=([^&]*)/.exec(location.search) || [])[1] || '';
var DEMO = !!DEMO_MODE;
function demoPlate(seed){
  try{
    var c = document.createElement('canvas'); c.width = c.height = 512;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0,0,512,512);
    g.addColorStop(0,'#f0c07a'); g.addColorStop(.55,'#c8763a'); g.addColorStop(1,'#40200f');
    x.fillStyle = g; x.fillRect(0,0,512,512);
    for (var i=0;i<26;i++){
      var r = 40 + ((seed*37 + i*91) % 120);
      x.beginPath();
      x.fillStyle = ['rgba(255,214,150,.30)','rgba(80,120,70,.30)','rgba(60,30,15,.28)','rgba(255,160,90,.25)'][(i+seed)%4];
      x.ellipse((seed*61+i*97)%512, (seed*113+i*57)%512, r, r*.72, i, 0, 6.29);
      x.fill();
    }
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
function demoRun(text){
  // The bad night, played through the same frame and the same handler the
  // engine drives, so what is reviewed here is what a child would actually
  // get rather than a mock-up of it.
  if (TROUBLE[DEMO_MODE]){
    later(function(){ handle('end', { story_id:1, reason:DEMO_MODE }); }, 1100);
    void text; return;
  }
  var title = 'Biscuit and the Dragon Who Kept the Lights On';
  // The spine too, so the demo previews the workshop the same way a real
  // story does - it is the only way to look at that screen without a device.
  later(function(){ handle('story', { story_id:1, title:title, page_count:3, spine:[
    'Biscuit is not afraid of the dark, but the dragon is.',
    'He carries a small warm lamp up the hill to him.',
    'They watch the stars come out, and everyone sleeps.'
  ] }); }, 900);
  var body3 = [
    'Biscuit had one folded ear and a red collar, and he was not afraid of the dark at all. ' +
    'But the dragon in the forest was. Every night he blinked his big worried eyes and kept the whole sky lit.',
    'So Biscuit trotted up the hill with a small warm lamp in his mouth. ' +
    'The dragon looked at it for a long moment, and then he sat down beside it, and the forest went soft and blue.',
    'They watched the stars come out one at a time, like little lamps of their own. ' +
    'And by the time the moon was up, the dragon was already asleep, and so was Biscuit, and so were you.'
  ];
  body3.forEach(function(t, i){
    later(function(){
      handle('page', { idx:i, text:t, image_url: (i === 1 ? null : demoPlate(i+2)), audio_url:null, last:(i === 2) });
    }, 2200 + i*1400);
  });
  void text;
}

/* ----------------------------------------------------------------------
   The workshop: what the lantern is doing, while it does it.
   ---------------------------------------------------------------------- */
var STAGE = {
