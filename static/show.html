<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Story Lantern</title>
<!--
==========================================================================
  STORY LANTERN — the lamp display.  One file. No framework, no CDN, no build.
  Served by lantern.py at  GET /show   (static/show.html)

  ------------------------------------------------------------------
  SERVER CONTRACT  (this is what the integrator must provide)
  ------------------------------------------------------------------
  GET  /events            text/event-stream, no buffering, keep-alive.
  POST /api/request       {"text": "..."}   -> 202 {"ok":true}   start a story
  POST /api/stop          {}                -> 200               stop now
  GET  /api/state         optional. Same body as the `hello` event. Used only
                          as a fallback if SSE dies repeatedly; a 404 here is
                          harmless and stays invisible.
  GET  /media/<story>/... the image_url / audio_url paths handed out in events.
  GET  /media/pageturn.wav  optional 4s ambience for the stall case. 404 is fine.

  EVENTS (named SSE events, JSON payloads).  Every one of them is optional and
  arriving twice is safe — the page is idempotent by page index.

    hello   {state, story:{story_id,title,page_count}|null, pages:[page,...],
             current_idx?:int}
              Sent immediately on connect so a browser refresh (or a kiosk
              restart mid-story) resumes exactly where it was. Include
              current_idx — the page being READ, not the newest one prefetched
              — or the display resumes on a page the story hasn't reached.
    state   {state:"idle"|"listening"|"thinking"|"telling"|"ending", line?:"..."}
              `line` is optional human copy shown while thinking, e.g. the
              confirmed-back request. Never send error text here.
    story   {story_id, title, page_count}
    page    {idx, text, image_url|null, audio_url|null, last?:bool}
              May arrive out of order and well ahead of display (prefetch).
    notice  {line:"..."}   a soft, human line. NOT an error. e.g.
              "the lantern is dreaming, try again in a moment"
    end     {reason:"finished"|"stopped"|"failed", line?:"..."}
    ping    {}             heartbeat, ignored.

  Field aliases accepted, so a small naming drift in the server can't break the
  demo: idx|index|page, text|prose, image_url|image|img, audio_url|audio.
  An unnamed SSE message carrying {"type":"page",...} is routed the same way.

  ------------------------------------------------------------------
  DEGRADATION RULES (all handled here, none of them show an error)
  ------------------------------------------------------------------
  * image missing / 404 / slow  -> the page is set as prose on a warm paper
    plate inside the same window. It looks deliberate, not broken.
  * audio missing / blocked     -> the page holds for a read-time computed from
    its word count, so the story still turns itself.
  * next page not ready         -> the current illustration HOLDS, the glow
    breathes, optional ambience loops. No spinner, ever, at any point.
  * SSE drops                   -> EventSource reconnects silently; after
    repeated failures we quietly poll /api/state.

  ?demo=1 renders a fake three-page story with canvas-painted plates so the
  visuals can be reviewed with no device attached.
==========================================================================
-->
<style>
/* ---------------------------------------------------------------------
   PALETTE
   A candle is not yellow — it is a warm orange core with a cool falloff.
   Everything here is built from a single amber family plus a bone-paper
   family, so the screen reads as ONE lit object in a dark room rather than
   as a UI with a theme. No pure black and no pure white anywhere.
   --------------------------------------------------------------------- */
:root{
  --room:        #0a0705;
  --amber:       #ffb968;
  --amber-hot:   #ffd9a3;
  --amber-deep:  #d9782a;
  --paper:       #f3e6cd;   /* the mat and the plate */
  --paper-deep:  #e2cda6;
  --cream:       #f0e2c6;   /* prose on the dark room */
  --ink:         #33271a;   /* prose on paper */

  /* One serif family for the whole thing. Bookish, present on every OS we
     ship to, and no webfont means no CDN and no flash of unstyled type. */
  --serif: "Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,
           Georgia,"Hoefler Text","Times New Roman",serif;

  --fade: 900ms;            /* page cross-fade. Mirrored in JS as FADE. */
  --ease: cubic-bezier(.4,0,.2,1);

  /* The plate is 512 native pixels when the panel can afford it and shrinks
     from there. Never upscaled past 512 — see spec §8.4, the frame is the
     design, not the upsampler. */
  --plate: clamp(160px, min(512px, calc(100vw - 10vmin), calc(100vh - 244px)), 512px);
  --mat:   clamp(9px, 2.1vmin, 18px);
}
@supports (height: 100svh){
  :root{ --plate: clamp(160px, min(512px, calc(100vw - 10vmin), calc(100svh - 244px)), 512px); }
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--room);
  color:var(--cream);
  font-family:var(--serif);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
body.hush{cursor:none}          /* kiosk: pointer disappears after a few seconds */

/* ---------------------------------------------------------------------
   THE ROOM
   Two fixed layers under everything: a static dark gradient (the room and
   the suggestion of a surface the lantern stands on) and the candle pool,
   whose brightness is the entire status language of this product.
   --------------------------------------------------------------------- */
#room{
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(120vmin 90vmin at 50% 42%, #241408 0%, #150c07 42%, var(--room) 78%),
    linear-gradient(to top, rgba(86,45,16,.42) 0%, rgba(20,11,6,0) 20%);
}
#glow{
  position:fixed; inset:-10%; z-index:1; pointer-events:none;
  background:
    radial-gradient(60vmin 52vmin at 50% 44%, rgba(255,168,78,.34), rgba(255,132,44,.12) 42%, transparent 72%),
    radial-gradient(120vmin 100vmin at 50% 50%, rgba(255,120,30,.08), transparent 70%);
  opacity:.55;
  transition:opacity 2.2s var(--ease);
  animation:breathe 7.5s ease-in-out infinite;
  will-change:opacity,transform;
}
/* Idle = a candle at rest. Thinking = the same candle, leaned into.
   No spinner, no percentage, no words: brightness is the only signal. */
body[data-phase="thinking"] #glow,
body[data-phase="listening"] #glow{ opacity:1; animation-duration:3.1s; }
body[data-phase="telling"]  #glow{ opacity:.34; animation-duration:11s; }
body.waiting #glow{ opacity:.62; animation-duration:5s; }  /* prefetch stall */
body[data-phase="over"] #glow{ opacity:.5; }

@keyframes breathe{
  0%,100%{ opacity:var(--o,.55); transform:scale(1) }
  50%    { transform:scale(1.045) }
}

/* ---------------------------------------------------------------------
   STAGE
   --------------------------------------------------------------------- */
#stage{
  position:relative; z-index:2;
  height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(10px,2.4vmin,30px);
  padding:clamp(10px,2.6vmin,40px);
  padding-bottom:clamp(30px,6vmin,66px);   /* keeps the page dots clear of the prose */
}

/* Running title: a hairline reminder of what we're inside of, from page two
   on. Deliberately almost invisible — it is for the parent, not the child. */
#running{
  position:fixed; top:clamp(10px,2.4vmin,22px); left:0; right:0; z-index:3;
  text-align:center; font-size:clamp(10px,1.5vmin,13px);
  letter-spacing:.22em; text-transform:uppercase; color:var(--amber);
  opacity:0; transition:opacity 1.4s var(--ease); pointer-events:none;
}
#running.on{opacity:.26}

/* ---------------------------------------------------------------------
   THE FRAME — paper mat + soft-cornered window.
   The mat is warm board, not white; it is what makes 512px read as a
   printed plate instead of a low-res JPEG. The outer shadow is doing two
   jobs: lifting the frame off the room, and spilling amber onto it so the
   picture looks lit from the same candle as everything else.
   --------------------------------------------------------------------- */
#frame{
  position:relative;
  width:calc(var(--plate) + var(--mat)*2);
  height:calc(var(--plate) + var(--mat)*2);
  padding:var(--mat);
  border-radius:calc(var(--mat) + 16px);
  background:
    /* board fibre: two fine gradient weaves, no image assets */
    repeating-linear-gradient(92deg, rgba(120,86,44,.055) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(3deg,  rgba(255,255,255,.05) 0 1px, transparent 1px 4px),
    radial-gradient(140% 120% at 30% 0%, #fbf0da 0%, var(--paper) 45%, var(--paper-deep) 100%);
  box-shadow:
    0 0 0 1px rgba(255,214,160,.16),
    0 1px 0 rgba(255,255,255,.35) inset,
    0 34px 70px -28px rgba(0,0,0,.92),
    0 0 90px 6px rgba(255,146,52,.14);
  opacity:0; transform:scale(.985);
  transition:opacity 1.1s var(--ease), transform 1.1s var(--ease);
}
body[data-phase="telling"] #frame,
body[data-phase="ending"]  #frame{ opacity:1; transform:scale(1); }

#window{
  position:relative; width:100%; height:100%;
  border-radius:calc(var(--mat) + 2px);
  overflow:hidden;
  background:#1a1108;
  box-shadow:0 0 0 1px rgba(80,52,22,.35) inset, 0 2px 10px rgba(0,0,0,.35) inset;
}

/* Two identical layers we ping-pong between. Cross-fading whole layers (not
   swapping an src) is what removes the flash between pages. */
.layer{
  position:absolute; inset:0; opacity:0;
  transition:opacity var(--fade) var(--ease);
}
.layer.on{opacity:1}
.layer img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; display:block;
  /* Ken-burns: the plate breathes so it reads as a lit object, not a still.
     Direction alternates per page (see .layer.alt) so it never feels mechanical. */
  animation:drift 34s ease-out both;
  transform-origin:52% 48%;
}
.layer.alt img{ animation-name:driftB; transform-origin:44% 56%; }
@keyframes drift { from{transform:scale(1.005)} to{transform:scale(1.045) translate(-1%,-.8%)} }
@keyframes driftB{ from{transform:scale(1.005)} to{transform:scale(1.045) translate(1%,.7%)} }

/* Prose-on-paper fallback: this is what a failed illustration looks like.
   It is a deliberate typographic page, so a child sees a book, not a gap. */
.layer .plate{
  position:absolute; inset:0; display:none; overflow:hidden;
  padding:clamp(18px,5%,42px);
  flex-direction:column; align-items:center; justify-content:center; text-align:center;
  color:var(--ink);
  background:
    repeating-linear-gradient(96deg, rgba(120,86,44,.05) 0 1px, transparent 1px 3px),
    radial-gradient(130% 110% at 40% 10%, #fdf4e2 0%, #f3e7ce 52%, #e6d3af 100%);
}
.layer.noart .plate{display:flex}
/* One inline font-size on the wrapper scales the whole block; the fit()
   routine in JS shrinks it until the page cannot possibly be clipped. */
.layer .plate .pwrap{ font-size:clamp(15px,3.05vmin,22px); line-height:1.62; max-width:30ch }
.layer .plate p{ font-size:1em }
.layer .plate .t{
  display:block; font-size:1.42em; line-height:1.2; margin-bottom:.7em;
  letter-spacing:.005em; color:#4a3721;
}

/* Vignette + grain sit ABOVE the art, always, including over the fallback
   plate. Same light on everything is what sells it as one object. */
#veil{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(115% 115% at 50% 44%, transparent 45%, rgba(30,14,4,.30) 78%, rgba(16,8,3,.62) 100%),
    linear-gradient(to bottom, rgba(255,196,124,.10), transparent 30%, rgba(60,28,8,.16));
  mix-blend-mode:multiply;
}
#grain{
  position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:
    repeating-conic-gradient(from 12deg at 50% 50%, rgba(255,255,255,.035) 0 1deg, transparent 1deg 3deg),
    repeating-linear-gradient(41deg, rgba(0,0,0,.05) 0 1px, transparent 1px 2px),
    repeating-linear-gradient(-38deg, rgba(255,240,214,.045) 0 1px, transparent 1px 3px);
  background-size:9px 9px, 3px 3px, 4px 4px;
  mix-blend-mode:overlay;
}

/* ---------------------------------------------------------------------
   THE CANDLE  — what the window holds when there is no page.
   A teardrop of light with an unhurried flicker. This is the product's
   resting face; it has to be lovely on its own for hours.
   --------------------------------------------------------------------- */
#candle{
  position:fixed; inset:0; z-index:2;
  display:flex; align-items:center; justify-content:center;
  opacity:1; transition:opacity 1.2s var(--ease);
  pointer-events:none;
}
body[data-phase="telling"] #candle,
body[data-phase="ending"]  #candle{ opacity:0 }
#halo{
  position:absolute; left:50%; top:50%;
  width:min(64vmin,520px); height:min(64vmin,520px);
  transform:translate(-50%,calc(-50% - 5vmin));
  background:radial-gradient(closest-side, rgba(255,186,102,.30), rgba(255,140,50,.11) 46%, transparent 74%);
  animation:flicker 3.7s ease-in-out infinite;
}
/* The flame is a square with three rounded corners turned 45° — the only
   shape plain CSS makes that genuinely tapers to a point. The animation
   lives on the container so the rotation on ::after stays put and rides
   along with it. */
#flame{
  position:relative;
  width:clamp(38px,6.6vmin,64px); height:clamp(38px,6.6vmin,64px);
  margin-bottom:10vmin;
  transform-origin:50% 100%;
  animation:flame 2.9s ease-in-out infinite;
}
#flame::after{
  content:""; position:absolute; inset:0;
  border-radius:6% 50% 50% 50%;
  /* read right-to-left: turn the sharp corner to the top, then stretch the
     whole teardrop along the vertical — a flame is taller than it is wide. */
  transform:scaleY(1.24) rotate(45deg);
  background:radial-gradient(circle at 64% 64%,
    #fffaf0 0%, var(--amber-hot) 13%, var(--amber) 31%, var(--amber-deep) 60%, rgba(163,58,8,.66) 90%);
  box-shadow:0 0 30px 8px rgba(255,150,60,.28);
  filter:blur(.6px);            /* a flame has no hard edge */
}
#flame::before{ /* the pool of light the flame stands in */
  content:""; position:absolute; left:50%; bottom:-16%;
  width:190%; height:44%; transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(255,172,84,.5), rgba(255,140,50,.14) 55%, transparent 78%);
}
@keyframes flame{
  0%,100%{ transform:scaleY(1)    scaleX(1)    translateX(0) }
  27%    { transform:scaleY(1.08) scaleX(.955) translateX(-2%) }
  53%    { transform:scaleY(.94)  scaleX(1.04) translateX(1.5%) }
  76%    { transform:scaleY(1.05) scaleX(.98)  translateX(-.8%) }
}
@keyframes flicker{ 0%,100%{opacity:.9} 40%{opacity:1} 65%{opacity:.78} }
body[data-phase="thinking"] #flame{ animation-duration:1.5s }
body[data-phase="thinking"] #halo { animation-duration:1.9s }

/* ---------------------------------------------------------------------
   PROSE under the plate.
   Sized for a parent reading from the doorway, measure held near 42ch so
   the eye can find the next line at that distance.
   --------------------------------------------------------------------- */
#prose{
  position:relative; z-index:2;
  /* Takes the space left under the plate, but never more than a third of the
     panel — beyond that the prose drifts away from the picture it belongs to.
     Unused slack stays with #stage, which keeps the whole column centred. */
  flex:1 1 auto; min-height:clamp(64px,12vmin,120px); max-height:min(34vh,320px);
  width:min(58ch, calc(100vw - 8vmin));
  text-align:center;
}
.pr{
  position:absolute; inset:0; opacity:0; overflow:hidden;
  transition:opacity var(--fade) var(--ease);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.pr.on{opacity:1}
/* Two acts share the prose box on page one: the title alone, then the page
   text. They cross-fade in place, which is why they stack rather than sit in
   a column — and it is why the type on a short kiosk panel can stay large.
   A title and sixty words competing for 150px is what makes bedside screens
   look like dashboards. */
.pr .wrap{
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center;
  opacity:1; transition:opacity 700ms var(--ease);
}
.pr .wrap.off{opacity:0}
.pr .wrap.hidden{display:none}
/* One inline font-size on .in scales the block; fit() moves that number. */
.pr .in{ font-size:clamp(16px,3.05vmin,27px) }
.pr p{
  font-size:1em; line-height:1.6; color:var(--cream);
  text-shadow:0 1px 2px rgba(0,0,0,.55);
  text-wrap:pretty;
}
/* Page one only: the title is hand-set — larger, looser, with a small
   ornament beneath. It appears once and is never repeated. */
.pr .in.title{
  font-size:1.9em; line-height:1.2; color:#ffe6bf;
  letter-spacing:.006em; text-shadow:0 2px 12px rgba(0,0,0,.65);
}
/* A hairline rule with a bead in the middle, drawn in gradients. A glyph
   ornament turns to mud at 12px on a small panel; this stays crisp. */
.pr .in.title::after{
  content:""; display:block; width:5.2em; height:4px; margin:.62em auto 0;
  background-image:
    radial-gradient(circle, var(--amber) 0 1.7px, transparent 2px),
    linear-gradient(90deg, transparent, rgba(255,185,104,.6) 22%, rgba(255,185,104,.6) 78%, transparent);
  background-size:100% 100%, 100% 1px;
  background-position:center, center;
  background-repeat:no-repeat;
  opacity:.9;
}

/* Page dots: a book's ribbon, not a progress bar. Barely there. */
#dots{
  position:fixed; bottom:clamp(12px,2.6vmin,26px); left:0; right:0; z-index:3;
  display:flex; gap:7px; justify-content:center;
  opacity:0; transition:opacity 1.2s var(--ease); pointer-events:none;
}
body[data-phase="telling"] #dots.on{opacity:.24}
#dots i{ width:5px; height:5px; border-radius:50%; background:var(--cream); opacity:.35 }
#dots i.now{ opacity:1; background:var(--amber) }

/* ---------------------------------------------------------------------
   THE ASK — one line of invitation and a hairline field.
   It is the only interactive thing on screen and it leaves as soon as the
   story starts, so the object stops being a computer.
   --------------------------------------------------------------------- */
/* The ask is taken OUT of the column flow deliberately: while a story is
   telling it is invisible, and if it still occupied a row it would steal a
   hundred pixels from the prose on a short kiosk panel — which is exactly
   where the prose can least afford it. */
#ask{
  position:absolute; left:0; right:0; bottom:clamp(12px,3vmin,40px); z-index:3;
  display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.7vmin,18px);
  transition:opacity 900ms var(--ease), transform 900ms var(--ease);
}
#ask.gone{ opacity:0; transform:translateY(10px); pointer-events:none; }
/* At rest the ask belongs to the candle, not to the bottom edge of a screen. */
body[data-phase="idle"] #ask,
body[data-phase="over"] #ask{ bottom:min(20vh,190px) }
/* On "Goodnight." the line stays and the field goes: the last thing on the
   screen at the end of a bedtime story should not be a text box. */
body[data-phase="over"] #field{ opacity:0; pointer-events:none }
#invite{
  font-size:clamp(17px,2.8vmin,25px); color:#f4dfba; opacity:.9;
  text-shadow:0 1px 8px rgba(0,0,0,.6); letter-spacing:.01em;
}
#field{
  width:min(34ch,80vw);
  font:italic 400 clamp(15px,2.3vmin,21px)/1.5 var(--serif);
  color:#ffeccd; text-align:center;
  background:transparent; border:0; border-bottom:1px solid rgba(255,185,104,.34);
  padding:.42em .6em .3em; outline:none;
  transition:border-color .5s var(--ease), box-shadow .5s var(--ease), opacity .8s var(--ease);
  user-select:text;
}
#field::placeholder{ color:rgba(244,223,186,.38) }
#field:focus{ border-bottom-color:rgba(255,185,104,.85); box-shadow:0 8px 22px -14px rgba(255,168,78,.9) }

/* A soft, human line for the awkward moments. Never red, never a dialog. */
#notice{
  position:fixed; left:0; right:0; bottom:clamp(34px,7vmin,64px); z-index:4;
  text-align:center; font-style:italic; color:var(--amber);
  font-size:clamp(14px,2vmin,18px); opacity:0;
  transition:opacity 1s var(--ease); pointer-events:none;
}
#notice.on{opacity:.72}

/* Echo of what the child asked for, shown while the lantern thinks. It is
   the confirmation that it heard, and it doubles as the only "progress" cue. */
#echo{
  /* Sits exactly where the input line was, so the request visibly takes the
     field's place. Slow to arrive, quick to leave — a long fade-out would
     still be crossing the title of page one when it lands. */
  position:fixed; left:0; right:0; bottom:min(20vh,190px); z-index:3;
  text-align:center; font-style:italic; font-size:clamp(15px,2.4vmin,22px);
  color:#f6dfb6; opacity:0; transition:opacity .45s var(--ease); pointer-events:none;
  padding:0 8vmin;
}
#echo.on{opacity:.62; transition:opacity 1.4s var(--ease)}

/* ---------------------------------------------------------------------
   SHORT LANDSCAPE (a laptop window, an odd panel): plate beside the prose
   instead of above it, so the picture never gets crushed.
   --------------------------------------------------------------------- */
@media (max-height:560px) and (min-aspect-ratio:13/10){
  :root{ --plate: clamp(150px, min(512px, calc(100vh - 76px)), 512px); }
  #stage{ flex-direction:row; gap:clamp(18px,4vw,54px) }
  #prose{ width:min(38ch,42vw); text-align:left }
  .pr{ justify-content:center; align-items:flex-start }
  .pr .title::after{ margin-left:0 }
  #ask{ position:fixed; bottom:clamp(10px,3vh,24px); left:0; right:0 }
}

/* ---------------------------------------------------------------------
   REDUCED MOTION — no drift, no breathing, no flicker. Cross-fades stay
   (a hard cut between pages is harsher than a fade) but they get short.
   --------------------------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  :root{ --fade:260ms }
  #glow,.layer img,#flame,#halo{ animation:none !important }
  #frame{ transition-duration:.3s }
  .layer img{ transform:none }
}
</style>
</head>
<body data-phase="idle">

<div id="room"></div>
<div id="glow"></div>

<div id="running" aria-hidden="true"></div>

<div id="candle"><div id="halo"></div><div id="flame"></div></div>

<main id="stage">
  <div id="frame">
    <div id="window">
      <div class="layer" id="L0"><img alt=""><div class="plate"><div class="pwrap"><p></p></div></div></div>
      <div class="layer" id="L1"><img alt=""><div class="plate"><div class="pwrap"><p></p></div></div></div>
      <div id="veil"></div>
      <div id="grain"></div>
    </div>
  </div>

  <!-- aria-live so a screen reader gets each page once, as it appears -->
  <div id="prose" aria-live="polite" aria-atomic="true">
    <div class="pr" id="P0"></div>
    <div class="pr" id="P1"></div>
  </div>

  <form id="ask" autocomplete="off">
    <div id="invite">Tell me a story about…</div>
    <input id="field" name="q" type="text" maxlength="160" enterkeyhint="go"
           placeholder="a dragon who's scared of the dark" aria-label="What should the story be about?">
  </form>
</main>

<div id="echo"></div>
<div id="notice"></div>
<div id="dots"></div>

<script>
"use strict";
(function(){

/* ======================================================================
   Constants and tiny helpers
   ====================================================================== */
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
var FADE    = REDUCED ? 260 : 900;      // must match --fade
var STALL_GIVEUP = 90000;               // UI safety net if the server never
                                        // sends the next page (spec caps the
                                        // server side at 45s; this is slower
                                        // on purpose so the server wins).
var THINK_GIVEUP = 90000;               // nothing at all after asking. A child
                                        // must never be left on a leaning
                                        // candle with no way out.
var WPS = 2.2;                          // words/sec ≈ 132wpm, for read-time
                                        // when narration is unavailable.

var $ = function(id){ return document.getElementById(id); };
var body = document.body;
var layers  = [$('L0'), $('L1')];
var proses  = [$('P0'), $('P1')];
var front   = 0;                        // which layer pair is visible

var S = {
  phase:   'idle',
  story:   null,
  pages:   new Map(),                   // idx -> page record
  current: null,
  turning: false,
  holding: false,
  ended:   false,
  fadeDone:true,
  audioDone:true,
  pending: null,                        // page waiting for both to finish
  timers:  [],                          // session-lifetime timers
  ptimers: [],                          // this-page-only timers
  titleT:  null,                        // page-one title reveal
  thinkT:  null                         // "no story ever arrived" clock
};

/* Two timer pools, deliberately. The page clock (ptimers) is torn down every
   time a new page starts reading; everything else — image-settle polls, the
   notice auto-hide, the goodnight chain — lives on the session pool and must
   survive a page turn. Sharing one pool silently cancelled pending pages. */
function clearPageTimers(){ S.ptimers.forEach(clearTimeout); S.ptimers = []; }
function pageLater(fn, ms){ var t = setTimeout(fn, ms); S.ptimers.push(t); return t; }
function clearTimers(){ clearPageTimers(); S.timers.forEach(clearTimeout); S.timers = []; }
function later(fn, ms){ var t = setTimeout(fn, ms); S.timers.push(t); return t; }
function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function words(t){ return String(t||'').trim().split(/\s+/).filter(Boolean).length; }
function readTime(t){ return Math.max(6000, (words(t)/WPS)*1000 + 1800); }

function setPhase(p){
  S.phase = p;
  body.setAttribute('data-phase', p);

  /* There is a 90s net for a mid-story stall but nothing ever watched the
     thinking phase. The engine's plan call can legitimately run two chat
     attempts of up to 420s HTTP each plus a 150004 backoff ride apiece, so a
     wedged or heavily contended device left a child staring at a leaning
     candle for many minutes with no story, no goodnight, and no way out but a
     grown-up. Arm a clock; end warmly if no page ever arrives. */
  clearTimeout(S.thinkT);
  if (p === 'thinking'){
    S.thinkT = setTimeout(function(){
      if (S.phase === 'thinking' && !S.current && !S.ended){
        notice('the lantern is dreaming, ask me again in a moment', 9000);
        // Tell the engine to let go too, or a story that finally lands 5
        // minutes later starts narrating into an idle bedroom.
        if (!DEMO) jpost('/api/stop', {}, function(){});
        finish();
      }
    }, THINK_GIVEUP);
  }
  // The ask leaves the moment a story exists and comes back when it's over.
  var hide = (p === 'thinking' || p === 'listening' || p === 'telling' || p === 'ending');
  $('ask').classList.toggle('gone', hide);
  // The echo of the child's request belongs to the waiting, and to nothing
  // else — once the first page is up it would sit on top of the prose.
  if (p !== 'thinking' && p !== 'listening') $('echo').classList.remove('on');
}

function notice(line, ms){
  var n = $('notice');
  if (!line){ n.classList.remove('on'); return; }
  n.textContent = line;
  n.classList.add('on');
  later(function(){ n.classList.remove('on'); }, ms || 7000);
}

/* ======================================================================
   Audio
   Each page owns its own <audio>, created as soon as the page arrives so
   the file is already buffered when its turn comes. Two live at most.
   ====================================================================== */
var unlocked = false;
function silentWavUrl(){
  // 0.1s of silence, built in-page so there is no asset and no base64 to typo.
  // Spec §8.7: play this on the first gesture to unlock audio on browsers
  // that ignore the kiosk autoplay flag.
  var rate = 8000, n = 800, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf), i;
  function str(o, s){ for (i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
  str(0,'RIFF'); v.setUint32(4, 36+n*2, true); str(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40, n*2, true);
  try { return URL.createObjectURL(new Blob([buf], {type:'audio/wav'})); } catch(e){ return null; }
}
function unlockAudio(){
  if (unlocked) return;
  unlocked = true;
  try {
    var u = silentWavUrl(); if (!u) return;
    var a = new Audio(u); a.volume = 0;
    var p = a.play(); if (p && p.catch) p.catch(function(){});
  } catch(e){ /* nothing to do; narration simply may not autoplay */ }
}

var ambience = null;
function ambienceOn(){
  // Optional bundled page-turn sound for the stall case. If the file isn't
  // there, this fails silently and the stall is just a quiet held page.
  try{
    if (!ambience){ ambience = new Audio('/media/pageturn.wav'); ambience.loop = true; ambience.volume = .28; }
    var p = ambience.play(); if (p && p.catch) p.catch(function(){});
  }catch(e){}
}
function ambienceOff(){ try{ if (ambience){ ambience.pause(); ambience.currentTime = 0; } }catch(e){} }

function prepAudio(pg){
  if (!pg.audio_url || pg._audio) return;
  try{
    var a = new Audio();
    a.preload = 'auto';
    a.src = pg.audio_url;
    a.addEventListener('error', function(){ pg._audioFailed = true; });
    pg._audio = a;
  }catch(e){ pg._audioFailed = true; }
}
function stopAudio(pg){
  if (pg && pg._audio){
    try{ pg._audio.pause(); }catch(e){}
    pg._audio.onended = null; pg._audio.ontimeupdate = null; pg._audio.onerror = null;
  }
}

/* Everything a story leaves behind. Called when the child changes their mind
   mid-story: the server stops the old session first, which publishes an `end`
   frame and drives finish() — so without this the NEW story's title and any of
   its pages that had already arrived were discarded ~10s later by resetToIdle,
   and a page 0 landing inside that window was swallowed permanently. */
function teardownStory(){
  clearTimers(); clearTimeout(S.titleT); clearTimeout(S.thinkT); ambienceOff();
  S.pages.forEach(stopAudio);
  S.pages = new Map();
  S.current = null; S.pending = null;
  S.turning = false; S.holding = false; S.ended = false;
  S.fadeDone = true; S.audioDone = true;
  body.classList.remove('waiting');
}

/* ======================================================================
   Images
   Preloaded and decoded BEFORE the cross-fade starts, so a page never
   fades in half-painted. A failure or a slow load just flips the page to
   the prose-on-paper treatment — which is a design, not an error state.
   ====================================================================== */
function prepImage(pg){
  if (pg._imgState || !pg.image_url){ if (!pg.image_url) pg._imgState = 'none'; return; }
  pg._imgState = 'loading';
  var im = new Image();
  var done = false;
  var give = setTimeout(function(){ if(!done){ done = true; pg._imgState = 'none'; } }, 12000);
  im.onload  = function(){ if(done) return; done = true; clearTimeout(give); pg._imgState = 'ok'; pg._img = im; };
  im.onerror = function(){ if(done) return; done = true; clearTimeout(give); pg._imgState = 'none'; };
  im.src = pg.image_url;
}
function imageSettled(pg){ return pg._imgState === 'ok' || pg._imgState === 'none' || !pg.image_url; }

/* ======================================================================
   Painting a page into the back layer
   ====================================================================== */
function paint(pg, slot){
  var L = layers[slot], P = proses[slot];
  var img = L.querySelector('img');
  var plate = L.querySelector('.plate');
  var pwrap = L.querySelector('.pwrap');
  var plateP = pwrap.querySelector('p');
  var isFirst = (pg.idx === 0);
  var title = (S.story && S.story.title) ? S.story.title : '';

  L.classList.toggle('alt', (pg.idx % 2) === 1);   // alternate ken-burns direction

  if (pg._imgState === 'ok' && pg.image_url){
    L.classList.remove('noart');
    img.style.display = '';
    img.src = pg.image_url;
    // Restart the drift animation for this page.
    img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
    var titled = isFirst && title;
    P.innerHTML =
      '<div class="wrap tt' + (titled ? '' : ' hidden') + '">' +
        '<div class="in title">' + esc(title) + '</div></div>' +
      '<div class="wrap bd' + (titled ? ' off' : '') + '">' +
        '<div class="in"><p>' + esc(pg.text) + '</p></div></div>';
    fit(P, P.querySelector('.bd .in'));
    if (titled) fit(P, P.querySelector('.tt .in'));
  } else {
    // Graceful degrade: the window becomes the page.
    L.classList.add('noart');
    img.removeAttribute('src'); img.style.display = 'none';
    plateP.innerHTML = (isFirst && title ? '<span class="t">' + esc(title) + '</span>' : '') + esc(pg.text);
    P.innerHTML = '';
    fit(plate, pwrap);
  }
  pg._slot = slot;

  // Running title from page two on.
  if (!isFirst && title){ $('running').textContent = title; $('running').classList.add('on'); }
  drawDots(pg.idx);
}

/* Shrink one wrapper until its block fits its box. A bedtime page is 55–70
   words but the model will occasionally hand us 90, and a clipped last line
   is the one typographic failure a parent WILL notice. Cheap insurance:
   at most 40 one-pixel steps, run on a hidden layer before it fades in. */
function fit(box, inner){
  if (!box || !inner) return;
  inner.style.fontSize = '';                    // back to the CSS clamp value
  var max = parseFloat(getComputedStyle(inner).fontSize) || 20;
  var cs  = getComputedStyle(box);
  var avail = box.clientHeight -
              (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
  if (avail <= 0) return;
  var size = max, guard = 0;
  while (inner.offsetHeight > avail && size > 11 && guard++ < 40){
    size -= 1;
    inner.style.fontSize = size + 'px';
  }
}

// Refit both layers when the window changes (kiosk rotation, a resized
// laptop window). Debounced; cheap enough to be unnoticeable.
var refitT = null;
window.addEventListener('resize', function(){
  clearTimeout(refitT);
  refitT = setTimeout(function(){
    for (var i = 0; i < 2; i++){
      var L = layers[i];
      if (L.classList.contains('noart')) fit(L.querySelector('.plate'), L.querySelector('.pwrap'));
      var ins = proses[i].querySelectorAll('.in');
      for (var j = 0; j < ins.length; j++) fit(proses[i], ins[j]);
    }
  }, 180);
});

function drawDots(idx){
  var total = (S.story && S.story.page_count) || S.pages.size || 0;
  var d = $('dots');
  if (!total){ d.classList.remove('on'); return; }
  var h = '';
  for (var i = 0; i < total; i++) h += '<i class="' + (i === idx ? 'now' : '') + '"></i>';
  d.innerHTML = h; d.classList.add('on');
}

/* ======================================================================
   Turning the page
   The cross-fade is started FADE ms before narration ends, so the new plate
   is fully present exactly as the last word lands. If the next page isn't
   ready we hold the current one — never a gap, never a spinner.
   ====================================================================== */
function show(pg, immediate){
  var slot = 1 - front;
  paint(pg, slot);

  if (immediate){
    // The immediate path skips maybeStart's audioDone gate, so nothing else
    // stops the voice that is already going. Without this, one reconnect
    // restarted narration on top of the page still being read.
    if (S.current && S.current !== pg) stopAudio(S.current);
    layers[front].classList.remove('on'); proses[front].classList.remove('on');
    layers[slot].classList.add('on');     proses[slot].classList.add('on');
    front = slot; S.current = pg; S.turning = false;
    S.pending = null; S.fadeDone = true;
    startNarration(pg);
    return;
  }

  S.turning = true;
  S.fadeDone = false;
  layers[slot].classList.add('on');   proses[slot].classList.add('on');
  layers[front].classList.remove('on'); proses[front].classList.remove('on');
  front = slot;
  S.current = pg;
  S.pending = pg;
  later(function(){ S.fadeDone = true; S.turning = false; maybeStart(); }, FADE);
}

function maybeStart(){
  // Narration for the incoming page begins only once BOTH the fade has
  // finished and the outgoing narration has actually stopped, so two voices
  // never overlap and there is still no silence gap of any length.
  if (!S.pending || !S.fadeDone || !S.audioDone) return;
  var pg = S.pending; S.pending = null;
  startNarration(pg);
}

function startNarration(pg){
  clearPageTimers();
  ambienceOff();
  body.classList.remove('waiting');
  S.audioDone = false;

  // Tell the server which page is being READ. This is the signal that releases
  // the producer to build page idx+1 — without it the engine falls back to a
  // 45s stall timer per page and the story visibly limps. Fire-and-forget: a
  // failed report costs a slower prefetch, never a broken page.
  reportProgress(pg.idx);

  // Page one: the hand-set title holds for a beat as the voice begins, then
  // settles into the page text. Same move as the demo — the title floats up,
  // and only then does the reading start under it.
  // Its own timer, not the page pool: if narration fails we fall back to a
  // read-time dwell, which tears the pool down — and the title would be left
  // frozen on screen with the page text never arriving underneath it.
  var tt = proses[pg._slot] ? proses[pg._slot].querySelector('.wrap.tt:not(.hidden)') : null;
  clearTimeout(S.titleT);
  if (tt && !tt.classList.contains('off')){
    S.titleT = setTimeout(function(){
      tt.classList.add('off');
      var bd = proses[pg._slot].querySelector('.wrap.bd');
      if (bd) bd.classList.remove('off');
    }, Math.min(3600, Math.max(1700, readTime(pg.text) * 0.26)));
  }

  prepAudio(pg);
  var a = pg._audio;

  var ended = function(){
    if (pg._done) return; pg._done = true;
    S.audioDone = true;
    maybeStart();
    onPageEnd(pg);
  };

  if (a && !pg._audioFailed){
    a.onended = ended;
    a.ontimeupdate = function(){
      if (a.duration && isFinite(a.duration) && (a.duration - a.currentTime) * 1000 <= FADE + 60){
        a.ontimeupdate = null;
        turnEarly(pg);
      }
    };
    a.onerror = function(){ pg._audioFailed = true; fallbackDwell(pg, ended); };
    var p;
    try { p = a.play(); } catch(e){ p = null; pg._audioFailed = true; }
    if (p && p.catch) p.catch(function(){ pg._audioFailed = true; fallbackDwell(pg, ended); });
    if (pg._audioFailed) fallbackDwell(pg, ended);
    // Safety net: if the audio element stalls entirely, still turn the page.
    pageLater(function(){ if (!pg._done) ended(); }, readTime(pg.text) + 45000);
  } else {
    fallbackDwell(pg, ended);
  }
}

function fallbackDwell(pg, ended){
  // No narration: hold the page for a read-time computed from its length so
  // a parent can read it aloud, then turn. Still no error shown anywhere.
  clearPageTimers();
  var d = readTime(pg.text);
  pageLater(function(){ turnEarly(pg); }, Math.max(1200, d - FADE));
  pageLater(function(){ ended(); }, d);
}

function turnEarly(pg){
  if (S.turning || S.ended) return;
  if (S.current !== pg) return;
  var nxt = S.pages.get(pg.idx + 1);
  if (nxt && imageSettled(nxt)) show(nxt, false);
}

function onPageEnd(pg){
  if (S.ended) return;
  if (S.current !== pg) return;      // we already turned early; nothing to do

  var nxt = S.pages.get(pg.idx + 1);
  if (nxt && imageSettled(nxt)){
    if (!S.turning) show(nxt, false);
    return;
  }
  if (pg.last){ finish(); return; }

  // The stall. The illustration holds, the glow leans in, the ambience loops.
  S.holding = true;
  body.classList.add('waiting');
  ambienceOn();
  pageLater(function(){
    if (S.holding && !S.ended) finish();   // UI safety net only
  }, STALL_GIVEUP);
}

function finish(){
  if (S.ended) return;
  S.ended = true; S.holding = false;
  clearPageTimers(); ambienceOff();
  body.classList.remove('waiting');
  setPhase('ending');
  later(function(){
    layers[0].classList.remove('on'); layers[1].classList.remove('on');
    proses[0].classList.remove('on'); proses[1].classList.remove('on');
    $('running').classList.remove('on');
    $('dots').classList.remove('on');
    setPhase('over');
    $('invite').textContent = 'Goodnight.';
    later(function(){ resetToIdle(); }, 9000);
  }, 1400);
}

function resetToIdle(){
  clearTimers(); clearTimeout(S.titleT); clearTimeout(S.thinkT); ambienceOff();
  S.pages.forEach(stopAudio);
  S.pages = new Map(); S.story = null; S.current = null;
  S.turning = false; S.holding = false; S.ended = false;
  S.pending = null; S.fadeDone = true; S.audioDone = true;
  layers[0].classList.remove('on','noart'); layers[1].classList.remove('on','noart');
  proses[0].classList.remove('on'); proses[1].classList.remove('on');
  proses[0].innerHTML = ''; proses[1].innerHTML = '';
  $('running').classList.remove('on'); $('running').textContent = '';
  $('dots').classList.remove('on');    $('dots').innerHTML = '';
  $('echo').classList.remove('on');
  $('invite').textContent = 'Tell me a story about…';
  $('field').value = '';
  setPhase('idle');
}

/* ======================================================================
   Incoming pages
   ====================================================================== */
/* Fold one incoming page record into S.pages and return it. No side effects on
   what is being shown — that is addPage's job. Split out so `hello` can resync
   the page set without also restarting the story. */
function mergePage(raw){
  var idx  = Number(raw.idx != null ? raw.idx : (raw.index != null ? raw.index : raw.page)) || 0;
  var iurl = raw.image_url || raw.image || raw.img || null;
  var aurl = raw.audio_url || raw.audio || null;

  // Re-delivery of a page we already hold is a MERGE, not a replace, so a
  // server that announces a page's text first and its media a moment later
  // still works. (Sending the page complete is preferred — if the art loses
  // the race to the display, that page shows as prose on paper.)
  var ex = S.pages.get(idx);
  if (ex){
    if (raw.text) ex.text = raw.text;
    if (raw.last) ex.last = true;
    if (iurl && !ex.image_url){ ex.image_url = iurl; ex._imgState = null; prepImage(ex); }
    if (aurl && !ex.audio_url){ ex.audio_url = aurl; ex._audioFailed = false; prepAudio(ex); }
    return null;                        // nothing new to start on
  }

  var pg = {
    idx: idx,
    text: raw.text != null ? raw.text : (raw.prose || ''),
    image_url: iurl,
    audio_url: aurl,
    last: !!raw.last
  };
  S.pages.set(pg.idx, pg);
  prepImage(pg);
  prepAudio(pg);

  if (S.story && S.story.page_count && pg.idx === S.story.page_count - 1) pg.last = true;
  return pg;
}

function addPage(raw){
  // A frame from a story the child has already moved on from. The engine can
  // have a producer parked in a 420s device call, and pages merge by index, so
  // index 3 of a dead story would otherwise overwrite index 3 of the live one.
  if (raw.story_id != null && S.story && S.story.story_id != null &&
      raw.story_id !== S.story.story_id) return;

  var pg = mergePage(raw);
  if (!pg) return;

  // First page: begin the story as soon as its art has settled (or failed).
  if (!S.current && pg.idx === 0){
    setPhase('telling');
    waitSettled(pg, function(){ show(pg, true); });
    return;
  }
  // We were holding for exactly this page.
  if (S.holding && S.current && pg.idx === S.current.idx + 1){
    waitSettled(pg, function(){
      if (!S.holding || S.ended) return;
      S.holding = false;
      ambienceOff(); body.classList.remove('waiting');
      show(pg, false);
    });
  }
}

function waitSettled(pg, fn){
  // Give the image a moment to decode; act the instant it settles either way.
  var t0 = Date.now();
  (function poll(){
    if (imageSettled(pg) || Date.now() - t0 > 12500){ fn(); return; }
    later(poll, 120);
  })();
}

/* ======================================================================
   Event routing
   ====================================================================== */
function handle(kind, data){
  try{
    if (kind === 'ping') return;

    if (kind === 'hello'){
      // `hello` arrives on EVERY SSE reconnect, and every 2.5s once the poll
      // fallback is running. It used to rebuild S.pages from scratch with brand
      // new page objects and then unconditionally show()+startNarration(),
      // which stacked a fresh <audio> and a fresh voice on top of the one still
      // playing — a chorus, growing every 2.5 seconds. It is a RESYNC, not a
      // restart: merge, and only take over the screen if we are not already on
      // the right page.
      if (data.story){
        if (S.story && S.story.story_id && data.story.story_id &&
            data.story.story_id !== S.story.story_id) teardownStory();
        S.story = data.story;
      }
      var list = data.pages || [];
      if (data.state === 'telling' && list.length){
        list.forEach(mergePage);
        // Prefer the page the child was actually on. Without current_idx we
        // land on the newest page we hold, which can be a prefetched one the
        // story hasn't reached yet — so the server should send it.
        var top = Math.max.apply(null, Array.from(S.pages.keys()));
        var cur = (data.current_idx != null && S.pages.has(Number(data.current_idx)))
                ? S.pages.get(Number(data.current_idx))
                : S.pages.get(top);
        if (!cur) return;
        if (S.current && S.current.idx === cur.idx) return;   // already reading it
        S.pages.forEach(stopAudio);
        prepImage(cur); prepAudio(cur);
        setPhase('telling');
        waitSettled(cur, function(){ show(cur, true); });
      } else if (data.state && data.state !== 'idle'){
        setPhase(data.state === 'planning' ? 'thinking' : data.state);
      }
      return;
    }

    if (kind === 'state'){
      var st = data.state || 'idle';
      if (st === 'idle')      { if (!S.current) resetToIdle(); }
      else if (st === 'planning') setPhase('thinking');
      else                        setPhase(st);
      if (data.line){ $('echo').textContent = data.line; $('echo').classList.add('on'); }
      return;
    }

    if (kind === 'story'){
      // The child changed their mind. The server stops the old session first,
      // which sends `end` and drives finish() — so tear the old story down HERE
      // rather than letting resetToIdle do it ~10s from now, on top of the new
      // story's title and any pages that have already arrived.
      if (S.story && S.story.story_id !== data.story_id) teardownStory();
      S.story = { story_id:data.story_id, title:data.title || '', page_count:data.page_count || 0 };
      lastReported = -1;              // a new story restarts the progress report
      setPhase('thinking');
      return;
    }

    if (kind === 'page'){ addPage(data); return; }

    if (kind === 'notice'){
      if (data.story_id != null && S.story && S.story.story_id != null &&
          data.story_id !== S.story.story_id) return;
      notice(data.line || data.text || '');
      return;
    }

    if (kind === 'end'){
      // Goodnight from a story that is already over and replaced.
      if (data.story_id != null && S.story && S.story.story_id != null &&
          data.story_id !== S.story.story_id) return;
      if (data.line) notice(data.line, 9000);
      if (S.current && !S.ended && data.reason === 'finished'){
        // Let the page in flight finish reading itself out.
        if (S.current) S.current.last = true;
        if (S.audioDone) finish();
      } else {
        finish();
      }
      return;
    }
  }catch(e){
    // A malformed event must never take the screen down.
    if (window.console && console.warn) console.warn('lantern: bad event', kind, e);
  }
}

/* ======================================================================
   Transport: SSE, with a silent poll fallback if it keeps dying.
   ====================================================================== */
var es = null, sseFails = 0, polling = null;
var KINDS = ['hello','state','story','page','notice','end','ping'];

function connect(){
  if (!window.EventSource){ startPolling(); return; }
  try { es = new EventSource('/events'); }
  catch(e){ startPolling(); return; }

  KINDS.forEach(function(k){
    es.addEventListener(k, function(ev){
      var d = {}; try { d = ev.data ? JSON.parse(ev.data) : {}; } catch(x){ d = { line: ev.data }; }
      handle(k, d);
    });
  });
  // Unnamed messages carrying {"type": "..."} are routed the same way.
  es.onmessage = function(ev){
    var d; try { d = JSON.parse(ev.data); } catch(x){ return; }
    if (d && d.type) handle(d.type, d);
  };
  es.onopen  = function(){ sseFails = 0; stopPolling(); };
  es.onerror = function(){
    // EventSource reconnects on its own; we stay quiet about it. Only after
    // it has failed repeatedly do we fall back to polling, still silently.
    sseFails++;
    if (sseFails >= 4) startPolling();
  };
}

function startPolling(){
  if (polling) return;
  polling = setInterval(function(){
    jget('/api/state', function(d){ if (d) handle('hello', d); });
  }, 2500);
}
function stopPolling(){ if (polling){ clearInterval(polling); polling = null; } }

function jget(url, cb){
  var ctl = window.AbortController ? new AbortController() : null;
  var kill = setTimeout(function(){ if (ctl) ctl.abort(); }, 4000);
  fetch(url, { signal: ctl ? ctl.signal : undefined, cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ clearTimeout(kill); cb(d); })
    .catch(function(){ clearTimeout(kill); cb(null); });
}

function jpost(url, obj, cb){
  var ctl = window.AbortController ? new AbortController() : null;
  var kill = setTimeout(function(){ if (ctl) ctl.abort(); }, 8000);
  fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(obj),
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){ clearTimeout(kill); cb(r.ok); })
    .catch(function(){ clearTimeout(kill); cb(false); });
}

/* Reading progress. The engine prefetches exactly one page ahead and waits for
   this before starting page N+1, so that we never hog a device we share with
   another tenant. Silent on every failure. */
var lastReported = -1;
function reportProgress(idx){
  if (DEMO) return;
  if (!S.story || S.story.story_id == null) return;
  if (idx <= lastReported) return;
  lastReported = idx;
  jpost('/api/progress', { story_id: S.story.story_id, idx: idx }, function(){});
}

/* ======================================================================
   The ask
   ====================================================================== */
$('ask').addEventListener('submit', function(e){
  e.preventDefault();
  var t = $('field').value.trim();
  if (t.length < 2) { $('field').focus(); return; }
  unlockAudio();
  ask(t);
});

function ask(text){
  setPhase('thinking');
  $('echo').textContent = text;
  $('echo').classList.add('on');
  try{ $('field').blur(); }catch(e){}
  if (DEMO){ demoRun(text); return; }
  jpost('/api/request', { text:text }, function(ok){
    if (!ok){
      // The device is busy or the server hiccuped. This is the one place a
      // child sees "no" and it is phrased as the lantern, not as an error.
      notice('the lantern is dreaming, ask me again in a moment', 8000);
      setPhase('idle');
      $('field').value = text;
    }
  });
}

/* Stop: Escape, or a long press of Space (the arcade button), matching the
   spec's physical stop. Never asks for confirmation. */
var spaceDown = 0;
document.addEventListener('keydown', function(e){
  if (e.target === $('field')) return;
  if (e.code === 'Space' && !spaceDown) spaceDown = Date.now();
  if (e.key === 'Escape') stopNow();
});
document.addEventListener('keyup', function(e){
  if (e.target === $('field')) return;
  if (e.code === 'Space'){
    var held = Date.now() - spaceDown; spaceDown = 0;
    if (held > 1200) stopNow();
    else if (S.phase === 'idle') $('field').focus();
  }
});
function stopNow(){
  if (S.phase === 'idle' || S.phase === 'over') return;
  S.pages.forEach(stopAudio);
  jpost('/api/stop', {}, function(){});
  finish();
}

/* Kiosk polish: hide the cursor when nothing is moving. */
var hushT = null;
function stirred(){
  body.classList.remove('hush');
  clearTimeout(hushT);
  hushT = setTimeout(function(){ body.classList.add('hush'); }, 4000);
}
['pointermove','pointerdown','keydown'].forEach(function(ev){
  document.addEventListener(ev, stirred, { passive:true });
});
stirred();

/* Any first gesture unlocks audio, in case the kiosk autoplay flag is absent. */
['pointerdown','keydown','touchstart'].forEach(function(ev){
  document.addEventListener(ev, unlockAudio, { once:true, passive:true });
});

/* ======================================================================
   ?demo=1 — a fake story with canvas-painted plates, so the look can be
   reviewed with no device on the network. Never runs otherwise.
   ====================================================================== */
var DEMO = /[?&]demo=1/.test(location.search);
function demoPlate(seed){
  try{
    var c = document.createElement('canvas'); c.width = c.height = 512;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0,0,512,512);
    g.addColorStop(0,'#f0c07a'); g.addColorStop(.55,'#c8763a'); g.addColorStop(1,'#40200f');
    x.fillStyle = g; x.fillRect(0,0,512,512);
    for (var i=0;i<26;i++){
      var r = 40 + ((seed*37 + i*91) % 120);
      x.beginPath();
      x.fillStyle = ['rgba(255,214,150,.30)','rgba(80,120,70,.30)','rgba(60,30,15,.28)','rgba(255,160,90,.25)'][(i+seed)%4];
      x.ellipse((seed*61+i*97)%512, (seed*113+i*57)%512, r, r*.72, i, 0, 6.29);
      x.fill();
    }
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}
function demoRun(text){
  var title = 'Biscuit and the Dragon Who Kept the Lights On';
  later(function(){ handle('story', { story_id:1, title:title, page_count:3 }); }, 900);
  var body3 = [
    'Biscuit had one folded ear and a red collar, and he was not afraid of the dark at all. ' +
    'But the dragon in the forest was. Every night he blinked his big worried eyes and kept the whole sky lit.',
    'So Biscuit trotted up the hill with a small warm lamp in his mouth. ' +
    'The dragon looked at it for a long moment, and then he sat down beside it, and the forest went soft and blue.',
    'They watched the stars come out one at a time, like little lamps of their own. ' +
    'And by the time the moon was up, the dragon was already asleep, and so was Biscuit, and so were you.'
  ];
  body3.forEach(function(t, i){
    later(function(){
      handle('page', { idx:i, text:t, image_url: (i === 1 ? null : demoPlate(i+2)), audio_url:null, last:(i === 2) });
    }, 2200 + i*1400);
  });
  void text;
}

/* ======================================================================
   Go
   ====================================================================== */
setPhase('idle');
if (!DEMO) connect();
// Focus the field on a desktop only; on a tablet this would raise the
// on-screen keyboard over the candle, which is exactly wrong at bedtime.
if (!('ontouchstart' in window)) { try{ $('field').focus(); }catch(e){} }

})();
</script>
